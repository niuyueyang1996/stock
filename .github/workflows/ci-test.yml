name: Go tests

# 日常质量门禁：push / PR 只跑 Go 全量单测（快速、离线）；打包由 v* 标签触发（见 android-apk.yml / windows-package.yml）
on:
  workflow_dispatch:
  push:
    branches:
      - "main"
      - "refactor/golang-backend"
    paths:
      - ".github/workflows/ci-test.yml"
      - "backend/**"
  pull_request:
    branches:
      - "main"
    paths:
      - "backend/**"

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: Go test (all packages)
        run: |
          cd backend
          go test ./... -count=1
