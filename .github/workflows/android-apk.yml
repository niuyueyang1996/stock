name: Build Android APK

# 打包仅由 v* 标签（或手动）触发；日常 push/PR 只跑单测（见 ci-test.yml）
on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android SDK (cmdline-tools + NDK)
        run: |
          mkdir -p "$HOME/android-sdk/cmdline-tools"
          curl -sL -o /tmp/cmdtools.zip \
            https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip -q /tmp/cmdtools.zip -d "$HOME/android-sdk/cmdline-tools/tmp"
          mv "$HOME/android-sdk/cmdline-tools/tmp/cmdline-tools" \
            "$HOME/android-sdk/cmdline-tools/latest"
          yes | "$HOME/android-sdk/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null 2>&1 || true
          "$HOME/android-sdk/cmdline-tools/latest/bin/sdkmanager" \
            "platform-tools" "platforms;android-35" "build-tools;34.0.0" "build-tools;35.0.0" "ndk;27.2.12479018" >/dev/null
          # runner 预装 ANDROID_SDK_ROOT=/usr/local/lib/android/sdk；必须与 ANDROID_HOME 统一，
          # 否则 Gradle 报 "Several environment variables ... different paths to the SDK"
          echo "ANDROID_HOME=$HOME/android-sdk" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$HOME/android-sdk" >> "$GITHUB_ENV"

      # cgo 必须开启：CGO_ENABLED=0 的纯 Go resolver 在 Android 上读不到 /etc/resolv.conf
      # （Android 用 netd），域名解析必失败（预热下载列表/指数全挂）。
      - name: Cross-compile Go backend (android/arm64, cgo + NDK)
        run: |
          cd backend
          mkdir -p ../packaging/android/app/src/main/jniLibs/arm64-v8a
          CC="$ANDROID_HOME/ndk/27.2.12479018/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android26-clang"
          CGO_ENABLED=1 GOOS=android GOARCH=arm64 CC="$CC" \
            go build -o ../packaging/android/app/src/main/jniLibs/arm64-v8a/libstockanalyzer.so ./cmd/server
          ls -lh ../packaging/android/app/src/main/jniLibs/arm64-v8a/libstockanalyzer.so

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon
        working-directory: packaging/android

      # APK 重命名与 Windows 命名保持一致：StockAnalyzer-{version}-{platform}-{arch}
      - name: Rename APK + SHA256 (align with Windows naming)
        run: |
          version=$(grep -o 'versionName = "[^"]*"' packaging/android/app/build.gradle.kts | cut -d'"' -f2)
          mkdir -p dist/android
          cp packaging/android/app/build/outputs/apk/debug/app-debug.apk \
            "dist/android/StockAnalyzer-${version}-android-arm64.apk"
          shasum -a 256 "dist/android/StockAnalyzer-${version}-android-arm64.apk" \
            | awk '{print $1}' > "dist/android/StockAnalyzer-${version}-android-arm64.apk.sha256"
          echo "APK: dist/android/StockAnalyzer-${version}-android-arm64.apk"

      - name: Validate release tag
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          version=$(grep -o 'versionName = "[^"]*"' packaging/android/app/build.gradle.kts | cut -d'"' -f2)
          if [ "v$version" != "${{ github.ref_name }}" ]; then
            echo "Tag ${{ github.ref_name }} does not match app version v$version"
            exit 1
          fi

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: StockAnalyzer-Android-arm64
          path: |
            dist/android/StockAnalyzer-*-android-arm64.apk
            dist/android/StockAnalyzer-*-android-arm64.apk.sha256
            packaging/android/app/build/outputs/apk/debug/output-metadata.json
          if-no-files-found: error

      - name: Publish tagged release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          # windows 安装器 exe 由 windows-package.yml 发布（共享 concurrency 串行）
          files: |
            dist/android/StockAnalyzer-*-android-arm64.apk
            dist/android/StockAnalyzer-*-android-arm64.apk.sha256
          generate_release_notes: true
          update_release_body: false
