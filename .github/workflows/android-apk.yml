name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - "main"
      - "refactor/golang-backend"
    tags:
      - "v*"
    paths:
      - ".github/workflows/android-apk.yml"
      - "backend/**"
      - "packaging/android/**"
      - "static/**"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android SDK (cmdline-tools)
        run: |
          mkdir -p "$HOME/android-sdk/cmdline-tools"
          curl -sL -o /tmp/cmdtools.zip \
            https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip -q /tmp/cmdtools.zip -d "$HOME/android-sdk/cmdline-tools/tmp"
          mv "$HOME/android-sdk/cmdline-tools/tmp/cmdline-tools" \
            "$HOME/android-sdk/cmdline-tools/latest"
          yes | "$HOME/android-sdk/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null 2>&1 || true
          "$HOME/android-sdk/cmdline-tools/latest/bin/sdkmanager" \
            "platform-tools" "platforms;android-35" "build-tools;35.0.0" >/dev/null
          echo "ANDROID_HOME=$HOME/android-sdk" >> "$GITHUB_ENV"

      - name: Cross-compile Go backend (android/arm64, zero CGO)
        run: |
          cd backend
          mkdir -p ../packaging/android/app/src/main/assets/bin
          CGO_ENABLED=0 GOOS=android GOARCH=arm64 \
            go build -o ../packaging/android/app/src/main/assets/bin/stockanalyzer-server ./cmd/server
          ls -lh ../packaging/android/app/src/main/assets/bin/stockanalyzer-server

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon
        working-directory: packaging/android

      - name: Validate release tag
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          version=$(grep -o 'versionName = "[^"]*"' packaging/android/app/build.gradle.kts | cut -d'"' -f2)
          if [ "v$version" != "${{ github.ref_name }}" ]; then
            echo "Tag ${{ github.ref_name }} does not match app version v$version"
            exit 1
          fi

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: StockAnalyzer-Android-arm64
          path: |
            packaging/android/app/build/outputs/apk/debug/app-debug.apk
            packaging/android/app/build/outputs/apk/debug/output-metadata.json
          if-no-files-found: error

      - name: Publish tagged release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: packaging/android/app/build/outputs/apk/debug/app-debug.apk
          generate_release_notes: true
