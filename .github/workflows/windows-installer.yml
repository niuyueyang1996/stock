name: Build Windows installer

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Verify vendored asset integrity
        shell: pwsh
        run: |
          $expected = "bf4a223524e40b77c304bec67e1222cf551f14880cf42c69dc046558e11c07b1"
          $actual = (Get-FileHash -Algorithm SHA256 static/vendor/echarts.min.js).Hash.ToLowerInvariant()
          if ($actual -ne $expected) {
            throw "ECharts checkout checksum mismatch: $actual"
          }

      - name: Set up Python 3.12 x64
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          architecture: "x64"
          cache: pip
          cache-dependency-path: packaging/windows/requirements-windows.lock

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --yes --no-progress

      - name: Validate release tag
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          $version = python -c "from app.version import APP_VERSION; print(APP_VERSION)"
          if ("v$version" -ne "${{ github.ref_name }}") {
            throw "Tag ${{ github.ref_name }} does not match app version v$version"
          }

      - name: Test and build installer
        shell: pwsh
        run: ./packaging/windows/build.ps1

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: StockAnalyzer-Windows-x64
          path: |
            dist/windows/StockAnalyzer-Setup-*-x64.exe
            dist/windows/StockAnalyzer-Setup-*-x64.exe.sha256
          if-no-files-found: error

      - name: Publish tagged release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/windows/StockAnalyzer-Setup-*-x64.exe
            dist/windows/StockAnalyzer-Setup-*-x64.exe.sha256
          generate_release_notes: true
