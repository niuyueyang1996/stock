name: Build Windows package

# 打包仅由 v* 标签（或手动）触发；日常 push/PR 只跑单测（见 ci-test.yml）
on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: Set up Python (icon)
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Generate app icon
        shell: pwsh
        run: |
          pip install pillow --quiet
          python packaging/windows/generate_icon.py

      - name: Build Go backend (windows/amd64, zero CGO)
        shell: pwsh
        run: |
          cd backend
          mkdir -p ../build/windows/StockAnalyzer
          $env:CGO_ENABLED = "0"
          $env:GOOS = "windows"
          $env:GOARCH = "amd64"
          go build -o ../build/windows/StockAnalyzer/stockanalyzer-server.exe ./cmd/server
          Get-Item ../build/windows/StockAnalyzer/stockanalyzer-server.exe | Select-Object Name, Length

      - name: Assemble package dir (exe + frontend)
        shell: pwsh
        run: |
          # 只复制前端；图标/语言文件由 .iss 内相对路径（相对 .iss 所在目录）直接引用
          Copy-Item -Path static -Destination build/windows/StockAnalyzer/static -Recurse

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --version=6.7.1 --yes --no-progress --allow-downgrade

      - name: Build installer (Setup exe)
        shell: pwsh
        run: |
          # ISCC 路径默认值相对 .iss 所在目录解析（SourceDir=../../build/windows/StockAnalyzer、
          # OutputDir=../../dist/windows、IconFile=stock-analyzer.ico、LanguageFile=languages/...），
          # 因此只需传入版本号
          $version = (Select-String -Path packaging/android/app/build.gradle.kts -Pattern 'versionName = "([^"]+)"').Matches.Groups[1].Value
          New-Item -ItemType Directory -Force -Path dist/windows | Out-Null
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          & $iscc packaging/windows/StockAnalyzer.iss /DMyAppVersion=$version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Get-ChildItem dist/windows/*.exe | ForEach-Object {
            $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower()
            Set-Content -Path "$($_.FullName).sha256" -Value $hash
            Write-Output "installer: $($_.Name) ($([math]::Round($_.Length / 1MB, 1)) MB)"
            Write-Output "sha256: $hash"
          }

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: StockAnalyzer-Windows-x64
          path: |
            dist/windows/StockAnalyzer-Setup-*-x64.exe
            dist/windows/StockAnalyzer-Setup-*-x64.exe.sha256
          if-no-files-found: error

      # release 由本 workflow 发 exe；android workflow 发 apk（update_release_body:false 防 changelog 重复）
      - name: Publish tagged release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/windows/StockAnalyzer-Setup-*-x64.exe
            dist/windows/StockAnalyzer-Setup-*-x64.exe.sha256
          generate_release_notes: true
          update_release_body: false
