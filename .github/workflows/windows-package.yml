name: Build Windows package

# 打包仅由 v* 标签（或手动）触发；日常 push/PR 只跑单测（见 ci-test.yml）
on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: Build Go backend (windows/amd64, zero CGO)
        shell: pwsh
        run: |
          cd backend
          mkdir -p ../build/windows/StockAnalyzer
          $env:CGO_ENABLED = "0"
          $env:GOOS = "windows"
          $env:GOARCH = "amd64"
          go build -o ../build/windows/StockAnalyzer/stockanalyzer-server.exe ./cmd/server
          Get-Item ../build/windows/StockAnalyzer/stockanalyzer-server.exe | Select-Object Name, Length

      - name: Assemble package (exe + static + launcher)
        shell: pwsh
        run: |
          Copy-Item packaging/windows/start.bat build/windows/StockAnalyzer/
          Copy-Item -Recurse static build/windows/StockAnalyzer/static

      - name: Zip package
        shell: pwsh
        run: |
          $version = (Select-String -Path packaging/android/app/build.gradle.kts -Pattern 'versionName = "([^"]+)"').Matches.Groups[1].Value
          New-Item -ItemType Directory -Force -Path dist/windows | Out-Null
          Compress-Archive -Path build/windows/StockAnalyzer -DestinationPath "dist/windows/StockAnalyzer-$version-windows-x64.zip" -CompressionLevel Optimal
          $hash = (Get-FileHash "dist/windows/StockAnalyzer-$version-windows-x64.zip" -Algorithm SHA256).Hash.ToLower()
          Set-Content -Path "dist/windows/StockAnalyzer-$version-windows-x64.zip.sha256" -Value $hash
          Write-Output "zip: dist/windows/StockAnalyzer-$version-windows-x64.zip ($((Get-Item dist/windows/StockAnalyzer-$version-windows-x64.zip).Length / 1MB) MB)"
          Write-Output "sha256: $hash"

      - name: Upload package artifact
        uses: actions/upload-artifact@v4
        with:
          name: StockAnalyzer-Windows-x64
          path: |
            dist/windows/StockAnalyzer-*-windows-x64.zip
            dist/windows/StockAnalyzer-*-windows-x64.zip.sha256
          if-no-files-found: error

      # 说明：release 统一由 android-apk.yml 发布（含本 workflow 的 zip 产物交叉编译版），
      # 避免多 workflow 并发写同一 tag release 导致 changelog 重复拼接。
