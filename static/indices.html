<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>指数 · 自建ETF</title>
  <link rel="stylesheet" href="/static/css/style.css">
  <script src="/static/vendor/echarts.min.js"></script>
  <style>
    /* 侧栏：白底浮于灰页，与页面背景拉开层次 */
    #indexSidebar {
      flex: 0 0 236px; position: sticky; top: 16px; align-self: flex-start;
      max-height: calc(100vh - 32px); overflow-y: auto;
      padding: 12px 10px 14px;
      background: #fff;
      border: 1px solid #e4e8f0;
      border-radius: 14px;
      box-shadow: 0 1px 3px rgba(20, 28, 50, .04);
    }
    #indexSidebar h3 { margin: 0 0 10px; font-size: 13px; font-weight: 700; color: #2a3140; letter-spacing: .02em; }
    #indexSidebar h3 .sub { font-size: 11px; color: #8b95a5; font-weight: 500; margin-left: 4px; }
    .tag-card {
      position: relative;
      border: 1px solid #e6eaf1; border-radius: 11px; padding: 10px 11px 9px;
      margin-bottom: 8px; cursor: pointer; user-select: none;
      background: #fff;
      transition: border-color .12s, box-shadow .12s, background .12s;
    }
    .tag-card::before {
      content: ''; position: absolute; left: 0; top: 10px; bottom: 10px; width: 2px;
      border-radius: 2px; background: transparent;
    }
    .tag-card:hover { border-color: #cfd7e6; box-shadow: 0 2px 8px rgba(20, 28, 50, .05); }
    .tag-card.on {
      border-color: #c5d4f5;
      background: #f7f9fd;
      box-shadow: inset 0 0 0 1px rgba(47, 111, 237, .08);
    }
    .tag-card.on::before { background: #2f6fed; }
    .tag-card .tc-head { display: flex; align-items: center; gap: 5px; }
    .tag-card .tc-check {
      color: #2f6fed; font-weight: 700; width: 12px; font-size: 11px;
      opacity: 0; transition: opacity .1s;
    }
    .tag-card.on .tc-check { opacity: 1; }
    .tag-card .tc-name {
      font-size: 13px; font-weight: 600; color: #1f2530; flex: 1;
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }
    .tag-card .tc-count { font-size: 11px; color: #8b95a5; flex: none; font-variant-numeric: tabular-nums; }
    .tag-card .tc-row {
      display: flex; align-items: baseline; justify-content: space-between;
      gap: 8px; margin-top: 6px;
    }
    .tag-card .tc-val {
      font-size: 16px; font-weight: 700; font-variant-numeric: tabular-nums;
      color: #1f2530; letter-spacing: -.02em; line-height: 1;
    }
    .tag-card .tc-day {
      font-size: 12px; font-weight: 600; font-variant-numeric: tabular-nums;
    }
    .tag-card .tc-meta {
      display: flex; align-items: baseline; justify-content: space-between;
      gap: 6px; margin-top: 5px; font-size: 11px; font-variant-numeric: tabular-nums;
    }
    .tag-card .tc-amt { color: #5c6573; font-weight: 500; }
    .tag-card .tc-amt b { color: #2a3140; font-weight: 600; }
    .tag-card .tc-vol { font-weight: 600; white-space: nowrap; }
    .tag-card .tc-vol.expand { color: #d13b3b; }
    .tag-card .tc-vol.shrink { color: #2b9a4a; }
    .tag-card .tc-vol.flat { color: #8b95a5; }
    .tag-card.all {
      background: #f5f7fb; border-style: dashed; border-color: #d8dee8;
      margin-bottom: 10px;
    }
    .tag-card.all.on { border-style: solid; background: #f7f9fd; border-color: #c5d4f5; }
    #indexRefreshAll { margin-top: 2px; }
  </style>
</head>
<body>
  <nav></nav>
  <div class="container" style="display:flex; align-items:flex-start; gap:16px">
    <aside id="indexSidebar">
      <h3>指数 <span class="sub" id="indexCount"></span></h3>
      <div id="indexAllCard" class="tag-card all" title="全选（点击切换）"></div>
      <button id="indexRefreshAll" class="btn" style="width:100%;margin-bottom:8px"
              title="刷新全部指数：日K增量 + 实时点位 + 分时量价（腾讯）。盘中早段抓取的残缺分时（如只到 09:33）会被补齐。">
        🔄 刷新全部指数
      </button>
      <div id="indexList"></div>
    </aside>
    <div style="flex:1; min-width:0">
      <div id="noSelection" class="empty" style="display:none;padding:60px 0">请至少选择一个指数。</div>
      <div id="rightContent">
        <div id="summary"></div>
        <div class="panel" id="fundflowPanel">
          <h2>指数资金面（全量价）<span class="sub" id="pfFlowNote">读图：浅蓝柱=各期成交额（高低看放缩），深灰折线=累计成交额；悬停看较上期变化。分钟窗=当日分时，天窗=多日聚合</span></h2>
          <div style="display:flex;align-items:flex-start;gap:10px;flex-wrap:wrap">
            <div id="pfFlowTabs"></div>
            <div style="flex:1"></div>
            <div id="pfFlowBatchBtn"></div>
          </div>
          <div id="pfFlowBatchPanel" style="display:none;margin:0 0 10px"></div>
          <div class="chart sm" id="pfFlowIntraday" style="width:100%;height:340px"></div>
          <div class="empty" id="pfFlowEmpty" style="display:none;padding:20px">暂无分时量价（请先「刷新全部指数」拉取，或今日非交易日）。</div>
        </div>
        <div class="panel" id="chartRow">
          <h2>权重分布（指数等权）</h2>
          <div class="chart sm" id="weightChart" style="height:340px"></div>
        </div>
        <div class="panel" id="tablePanel">
          <h2 style="margin:0">指数列表</h2>
          <div style="overflow-x:auto">
            <table>
              <thead>
                <tr><th>代码</th><th>名称</th><th>点位</th><th>涨跌幅</th></tr>
              </thead>
              <tbody id="indexBody"></tbody>
            </table>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="/static/js/api.js"></script>
  <script src="/static/js/common.js"></script>
  <script src="/static/js/charts.js"></script>
  <script>
    initNav('indices');

    let allIndices = [];
    let selected = new Set();
    let loaded = false;
    // 资金流统一时间窗（与个股/组合页同口径）
    const FLOW_WINDOWS = ['1m', '5m', '15m', '30m', '1d', '7d', '30d'];
    const FLOW_WINDOW_LABEL = { '1m': '1分钟', '5m': '5分钟', '15m': '15分钟', '30m': '30分钟',
                                '1d': '1天', '7d': '7天', '30d': '30天' };
    let pfFlowWindow = '15m';   // 当前选中窗口（绘图与 AI 分析共用）
    let indexFlowReports = {};  // 指数资金面 map：{code:{correlation,summary,trade_date,window,source}}

    // 叠加折线配色
    const PALETTE = ['#2563eb', '#e03131', '#2f9e44', '#f76707', '#7048e8', '#0ca678',
                     '#f59f00', '#339af0', '#c2255c', '#495057', '#1c7ed6', '#12b886'];

    function nameMap() {
      const m = {};
      allIndices.forEach((d) => { m[d.code] = d.name; });
      return m;
    }

    function selList() {
      return allIndices.filter((d) => selected.has(d.code));
    }

    function renderSidebar() {
      const on = allIndices.length > 0 && selected.size === allIndices.length;
      const partial = selected.size > 0 && !on;
      const el = document.getElementById('indexAllCard');
      el.className = 'tag-card all' + (on ? ' on' : '');
      el.innerHTML = `
        <div class="tc-head">
          <span class="tc-check">${on ? '✓' : partial ? '–' : ''}</span>
          <span class="tc-name">全选</span>
          <span class="tc-count">${selected.size}/${allIndices.length}</span>
        </div>`;

      const volLabel = (t) => {
        if (!t || t.chg_pct == null || !t.state) {
          return '<span class="tc-vol flat" title="请先「刷新全部指数」拉取分时后再看额较昨">额较昨 —</span>';
        }
        const word = t.state === 'expand' ? '放量' : (t.state === 'shrink' ? '缩量' : '持平');
        const est = t.basis === 'scaled' ? '估' : '';
        const tip = t.basis === 'intraday' && t.as_of
          ? `成交额较昨同时段实算（至 ${t.as_of}）`
          : (t.basis === 'scaled' && t.as_of
            ? `成交额较昨同时段估算（至 ${t.as_of}；昨分时未缓存，按交易进度折算。刷新后可落昨分时改实算）`
            : '成交额较昨全日');
        const prev = t.prev_amount != null ? `，昨约 ${fmtAmt(t.prev_amount)}` : '';
        const sign = t.chg_pct > 0 ? '+' : '';
        return `<span class="tc-vol ${t.state}" title="${tip}${prev}">${word}${est} ${sign}${t.chg_pct}%</span>`;
      };

      const list = document.getElementById('indexList');
      list.innerHTML = allIndices.map((d, i) => {
        const s = selected.has(d.code);
        const q = d.quote || {};
        const t = d.turnover || {};
        const amt = t.amount != null ? t.amount : q.amount;
        return `
        <div class="tag-card ${s ? 'on' : ''}" data-i="${i}" title="点击切换（勾选 = 参与汇总）">
          <div class="tc-head">
            <span class="tc-check">${s ? '✓' : ''}</span>
            <span class="tc-name">${esc(d.name)}</span>
          </div>
          <div class="tc-row">
            <span class="tc-val">${q.price == null ? '—' : fmtNum(q.price)}</span>
            <span class="tc-day ${cls(q.pct_chg)}">${q.pct_chg == null ? '—' : signed(q.pct_chg) + '%'}</span>
          </div>
          <div class="tc-meta">
            <span class="tc-amt">额 <b>${amt == null ? '—' : fmtAmt(amt)}</b></span>
            ${volLabel(t)}
          </div>
        </div>`;
      }).join('');
      list.querySelectorAll('.tag-card[data-i]').forEach((el2) => {
        el2.addEventListener('click', () => {
          const code = allIndices[+el2.dataset.i].code;
          if (selected.has(code)) selected.delete(code); else selected.add(code);
          renderSidebar();
          loadPage();
        });
      });
      document.getElementById('indexCount').textContent = `已选 ${selected.size}/${allIndices.length}`;
    }

    document.getElementById('indexAllCard').addEventListener('click', () => {
      selected = selected.size === allIndices.length ? new Set() : new Set(allIndices.map((d) => d.code));
      renderSidebar();
      loadPage();
    });

    // 「刷新全部指数」：并发重拉全部指数（日K/点位/估值/资金流），完成后刷新列表
    document.getElementById('indexRefreshAll').addEventListener('click', async () => {
      const btn = document.getElementById('indexRefreshAll');
      const label = btn.textContent;
      btn.disabled = true;
      btn.textContent = '已提交…';
      try {
        const job = await startBackgroundJob('/indices/refresh-all', {}, { toast: '全部指数刷新已开始，进度见顶部' });
        if (job && job.job_id) await waitForJob(job.job_id);
        loaded = false;
        await loadPage();
        toast('指数刷新完成，侧栏已更新成交额较昨');
      } catch (e) {
        toast('指数刷新失败：' + e.message, 5000);
      } finally {
        btn.disabled = false;
        btn.textContent = label;
      }
    });

    function renderSummary() {
      const card = ([l, v, note]) =>
        `<div class="card"><div class="label">${l}</div><div class="value">${v}</div>${note ? `<div class="label muted">${note}</div>` : ''}</div>`;
      document.getElementById('summary').innerHTML = `
        <div class="cards summary-main" style="margin-bottom:20px">
          ${card(['选中指数', `${selected.size}/${allIndices.length}`, '点击左侧卡片多选 / 全选'])}
        </div>`;
      setPanelSummary('tablePanel', sumKV('已选', selected.size + ' 只'));
      setPanelSummary('chartRow', selected.size ? sumKV('等权', selected.size + ' 只') : '未选择');
      setPanelSummary('fundflowPanel', selected.size
        ? sumKV('已选', selected.size + ' 只') + sumSep() + sumChip(FLOW_WINDOW_LABEL[pfFlowWindow] || pfFlowWindow)
        : '未选择');
    }

    // 权重分布：指数等权（每只 100/n）
    function renderWeights() {
      const rows = selList();
      if (!rows.length) return;
      const n = rows.length;
      weightPie(
        document.getElementById('weightChart'),
        rows.map((d) => ({ name: d.name, value: +((100 / n).toFixed(2)) })),
        '指数权重（等权）',
      );
    }

    function renderTable() {
      const body = document.getElementById('indexBody');
      const rows = selList().sort((a, b) => a.code.localeCompare(b.code));
      body.innerHTML = rows.map((d) => {
        const q = d.quote || {};
        return `<tr>
          <td><a href="/static/stock.html?code=${d.code}&index=1">${d.code}</a></td>
          <td>${esc(d.name)}</td>
          <td>${q.price == null ? '—' : fmtNum(q.price)}</td>
          <td class="${cls(q.pct_chg)}">${q.pct_chg == null ? '—' : signed(q.pct_chg) + '%'}</td>
        </tr>`;
      }).join('');
    }

    // ============ 指数资金流（组合页同构：等权求和 + 批量 AI 分析） ============

    // 批量分析选中指数按钮：1m/5m 窗口过小拒绝；成功后重建相关性块
    (function () {
      const wrap = document.getElementById('pfFlowBatchBtn');
      const panel = document.getElementById('pfFlowBatchPanel');
      if (!wrap || !panel) return;
      wrap.innerHTML = '<button class="btn" data-fundflow-batch style="margin-bottom:8px">⚡ 批量分析指数</button>';
      wrap.querySelector('[data-fundflow-batch]').onclick = () => {
        if (/^(1|5)m$/.test(pfFlowWindow)) {
          toast('批量分析窗口过小，请选择 15 分钟及以上');
          return;
        }
        const codes = [...selected];
        if (!codes.length) return;
        runFundflowBatch({ codes, window: pfFlowWindow, btn: wrap.querySelector('[data-fundflow-batch]'), panel, onDone: loadAndRender });
      };
    })();

    // 重拉资金面报告 map + 重建批量面板（分析完成/选择切换后复用）
    async function loadAndRender() {
      indexFlowReports = await loadFlowReports([...selected]);
      await renderPersistedBatchPanel();
    }

    // 刷新后从落库报告重建「批量分析指数」面板（只取 source=batch），F5 不丢
    async function renderPersistedBatchPanel() {
      const panel = document.getElementById('pfFlowBatchPanel');
      if (!panel) return;
      const nameMap2 = {};
      allIndices.forEach((d) => { nameMap2[d.code] = d.name; });
      const reports = Object.entries(indexFlowReports)
        .filter(([, r]) => r && r.source === 'batch')
        .map(([code, r]) => ({
          code, name: nameMap2[code] || '', correlation: r.correlation, summary: r.summary,
          trade_date: r.trade_date, window: r.window, source: r.source,
        }));
      if (!reports.length) {
        panel.style.display = 'none';
        panel.innerHTML = '';
        return;
      }
      panel.style.display = 'block';
      // 组合相关性块：只精确匹配当前选中的指数组合（排序归一同 key），
      // 必须再次选中该组合才能看到其相关性；没匹配到不显示（不取别的组合）
      const coh = await loadCoherence('indices', [...selected].sort().join(','), reports[0].window);
      renderFundflowBatchPanel(panel, {
        mode: 'indices', window: reports[0].window, stocks_count: reports.length,
        date: reports[0].trade_date, reports, coherence: coh, html: coh ? coh.html : '',
      });
    }

    // 指数资金面：腾讯量价等权求和（选中指数），量价图随统一时间窗切换
    let pfFlowSeq = 0;
    async function renderPfFlow() {
      const seq = ++pfFlowSeq;
      try {
        const d = await api('/indices/fundflow?codes=' + encodeURIComponent([...selected].join(',')));
        if (seq !== pfFlowSeq) return;                     // 过期响应丢弃
        const panel = document.getElementById('fundflowPanel');
        if (panel) panel.style.display = '';               // 成功渲染恢复面板可见
        const note = document.getElementById('pfFlowNote');
        if (note) {
          note.textContent = '读图：浅蓝柱=各期成交额（柱高看放缩），深灰线=累计额；悬停看较上期%。覆盖 '
            + d.covered + '/' + d.total + ' 指数 · 分钟窗=当日分时，天窗=多日';
        }
        setPanelSummary('fundflowPanel',
          sumKV('覆盖', d.covered + '/' + d.total) + sumSep() + sumChip(FLOW_WINDOW_LABEL[pfFlowWindow] || pfFlowWindow));
        const empty = document.getElementById('pfFlowEmpty');
        const intraday = d.intraday || [];
        const daily = d.daily || [];
        if (!intraday.length && !daily.length) {
          if (empty) empty.style.display = 'block';
          document.getElementById('pfFlowTabs').innerHTML = '';
          document.getElementById('pfFlowIntraday').innerHTML = '';
          return;
        }
        if (empty) empty.style.display = 'none';
        const names = nameMap();
        const intraEl = document.getElementById('pfFlowIntraday');
        const draw = (w) => {
          pfFlowWindow = w;
          setPanelSummary('fundflowPanel',
            sumKV('覆盖', d.covered + '/' + d.total) + sumSep() + sumChip(FLOW_WINDOW_LABEL[w] || w));
          if (/m$/.test(w)) {
            if (!intraday.length) { intraEl.innerHTML = ''; return; }
            const pts = resampleIndexVolume(intraday, parseInt(w, 10));
            indexVolumePrice(intraEl, pts, FLOW_WINDOW_LABEL[w] + '分时', names);
          } else {
            if (!daily.length) { intraEl.innerHTML = ''; return; }
            const days = bucketIndexVolume(daily, parseInt(w, 10));
            indexVolumePrice(intraEl, days, FLOW_WINDOW_LABEL[w], names);
          }
        };
        const tabsEl = document.getElementById('pfFlowTabs');
        tabsEl.innerHTML = '';
        tabsEl.appendChild(periodTabs({
          periods: FLOW_WINDOWS.map((w) => FLOW_WINDOW_LABEL[w]),
          active: FLOW_WINDOW_LABEL[pfFlowWindow],
          onChange: (label) => { draw(Object.keys(FLOW_WINDOW_LABEL).find((k) => FLOW_WINDOW_LABEL[k] === label)); },
        }));
        draw(pfFlowWindow);
      } catch (e) {
        if (seq !== pfFlowSeq) return;
        // 失败时保留面板（可折叠标题仍在），只标摘要，勿 display:none 整块消失
        setPanelSummary('fundflowPanel', '加载失败');
        const empty = document.getElementById('pfFlowEmpty');
        if (empty) {
          empty.style.display = 'block';
          empty.textContent = '指数资金面加载失败：' + (e && e.message ? e.message : e);
        }
      }
    }

    async function loadPage() {
      const right = document.getElementById('rightContent');
      const noSel = document.getElementById('noSelection');
      const showEmpty = () => { right.style.display = 'none'; noSel.style.display = 'block'; };
      const showContent = () => { right.style.display = ''; noSel.style.display = 'none'; };
      try {
        // 每次重拉摘要（含成交额较昨）；首次默认不选
        const data = await api('/indices', { blocking: !loaded, silent: loaded });
        const keep = loaded ? selected : new Set();
        allIndices = data || [];
        if (!loaded) {
          selected = new Set();
          loaded = true;
        } else {
          selected = new Set([...keep].filter((c) => allIndices.some((d) => d.code === c)));
        }
      } catch (e) {
        document.getElementById('indexBody').innerHTML =
          '<tr><td colspan="4" class="muted">加载失败：' + esc(e.message) + '</td></tr>';
        return;
      }
      renderSidebar();
      if (selected.size === 0) { showEmpty(); return; }
      showContent();
      renderSummary();
      renderWeights();
      renderTable();
      await loadAndRender();
      renderPfFlow();
    }

    makeFoldable(document.getElementById('fundflowPanel'), { id: 'fundflowPanel', defaultOpen: true });
    makeFoldable(document.getElementById('chartRow'), { id: 'chartRow', defaultOpen: false });
    makeFoldable(document.getElementById('tablePanel'), { id: 'tablePanel', defaultOpen: true });
    loadPage();
  </script>
</body>
</html>
