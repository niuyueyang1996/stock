<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>持仓总览 · 股票持仓分析</title>
  <link rel="stylesheet" href="/static/css/style.css">
  <script src="/static/vendor/echarts.min.js"></script>
</head>
<body>
  <nav></nav>
  <div class="container">
    <div class="cards" id="summary"></div>
    <div class="panel">
      <div class="row">
        <h2 style="margin:0">持仓明细</h2>
        <span class="sub">数据来自本地缓存；要最新价可点右上角「更新行情」</span>
        <span class="grow"></span>
        <select id="sortSel" title="排序">
          <option value="weight_desc">权重降序</option>
          <option value="weight_asc">权重升序</option>
          <option value="tag">按标签</option>
          <option value="code">按代码</option>
        </select>
        <div class="view-toggle" id="viewToggle">
          <button type="button" class="active" data-view="list">列表</button>
          <button type="button" data-view="card">卡片</button>
        </div>
      </div>
      <div id="listView" style="overflow-x:auto">
        <div id="holdingsGroups"></div>
      </div>
      <div id="cardView" class="cards" style="display:none;margin-bottom:0"></div>
      <div class="empty empty-guide" id="emptyTip" style="display:none">
        <div class="eg-title">还没有持仓</div>
        <div class="eg-block">
          <div class="eg-h">有同花顺（推荐）</div>
          <ol>
            <li>打开
              <a href="https://tzzb.10jqka.com.cn/pc/index.html#/myAccount" target="_blank" rel="noopener">同花顺账户页</a>
              ，导出「汇总持仓.xlsx」
            </li>
            <li>到 <a href="/static/trade.html">交易评分</a> 页，点「导入 Excel」上传（仅空仓时可导入）</li>
          </ol>
        </div>
        <div class="eg-block">
          <div class="eg-h">没有同花顺也没关系</div>
          <p>直接去 <a href="/static/trade.html">交易评分</a> 页，搜索股票代码，录入一笔买入即可。</p>
        </div>
        <p class="muted" style="margin-top:12px;font-size:12px">导入或录入后，建议点右上角「完整更新」拉一次历史数据。详见 <a href="/static/help.html">使用帮助</a>。</p>
      </div>
      <div class="row" style="margin-top:14px;justify-content:flex-end">
        <button class="btn danger" id="resetBtn" onclick="resetAll()" title="清空交易、持仓和缓存（不可恢复）">清空全部数据</button>
      </div>
    </div>
  </div>

  <script src="/static/js/api.js"></script>
  <script src="/static/js/common.js"></script>
  <script src="/static/js/charts.js"></script>
  <script>
    initNav('index');

    let viewMode = 'list';
    let sortMode = 'weight_desc';

    function setupViewToggle() {
      document.getElementById('viewToggle').querySelectorAll('button').forEach((b) => {
        b.onclick = () => {
          document.getElementById('viewToggle').querySelectorAll('button').forEach((x) => x.classList.remove('active'));
          b.classList.add('active');
          viewMode = b.dataset.view;
          document.getElementById('listView').style.display = viewMode === 'list' ? '' : 'none';
          document.getElementById('cardView').style.display = viewMode === 'card' ? 'grid' : 'none';
        };
      });
    }

    // 一键清空全部数据（双重确认，防误触；评分权重配置保留）
    async function resetAll() {
      if (!confirm('确定清空全部数据？\n\n将删除：\n· 全部买卖记录\n· 持仓与股票信息\n· AI 评分报告\n· 本地缓存的行情/估值等\n\n此操作不可恢复。\n（AI 模型配置会保留）')) return;
      if (!confirm('再确认一次：真的要全部清空吗？')) return;
      const btn = document.getElementById('resetBtn');
      btn.disabled = true;
      try {
        const r = await api('/data/reset', { blocking: true, method: 'POST', body: { confirm: true } });
        toast(`已清空 ${r.deleted_rows} 行数据`);
        await loadPage();
      } catch (e) {
        toast('清空失败：' + e.message, 4000);
      } finally {
        btn.disabled = false;
      }
    }

    function renderCards(p) {
      const wrap = document.getElementById('cardView');
      wrap.innerHTML = '';
      const groups = groupByTag(sortedStocks(p.stocks));
      Object.keys(groups).forEach((tag) => {
        const head = document.createElement('h3');
        head.textContent = tag;
        wrap.appendChild(head);
        groups[tag].forEach((s) => {
          const card = document.createElement('div');
          const tone = s.pnl_pct > 0 ? 'is-up' : (s.pnl_pct < 0 ? 'is-down' : '');
          const wPct = Math.max(0, Math.min(100, Number(s.weight) || 0));
          card.className = 'card stock-card' + (tone ? ' ' + tone : '');
          card.innerHTML = `
            <div class="sc-inner">
              <div class="sc-head">
                <a class="sc-code" href="/static/stock.html?code=${s.code}">${s.code}</a>
                <span class="sc-name" title="${esc(s.name || '')}">${esc(s.name || '')}</span>
                <span class="tag-badge edittag" data-edittag="${s.code}" title="点击修改标签">${esc(s.tag || '')}</span>
              </div>
              <div class="sc-hero">
                <div>
                  <div class="sc-pnl ${cls(s.pnl_pct)}">${signed(s.pnl_pct)}%</div>
                  <div class="sc-pnl-sub">盈亏 <span class="${cls(s.pnl)}">${signed(s.pnl)}</span>
                    · 今日 <span class="${cls(s.day_pnl)}">${signed(s.day_pnl)}</span></div>
                </div>
                <div class="sc-weight">
                  <div class="sc-w-label">权重</div>
                  <div class="sc-w-val">${fmtNum(s.weight)}%</div>
                  <div class="bar"><i style="width:${wPct}%"></i></div>
                </div>
              </div>
              <div class="sc-grid">
                <div><span class="k">现价</span><span>${fmtNum(s.price)}</span></div>
                <div><span class="k">市值</span><span>${fmtNum(s.value)}</span></div>
                <div><span class="k">成本</span><span>${fmtNum(s.avg_cost)}</span></div>
                <div><span class="k">数量</span><span>${fmtNum(s.quantity)}</span></div>
                <div><span class="k">PE</span><span>${fmtNum(s.pe)}</span></div>
                <div><span class="k">PB</span><span>${fmtNum(s.pb)}</span></div>
                <div><span class="k">PE分位</span><span>${fmtNum(s.pe_pct)}%</span></div>
                <div><span class="k">PB分位</span><span>${fmtNum(s.pb_pct)}%</span></div>
                <div><span class="k">股息率</span><span>${fmtNum(s.dv)}%</span></div>
                <div><span class="k">ROE</span><span>${fmtPct(s.roe)}</span></div>
                <div><span class="k">累计分红</span><span>¥${fmtNum(s.total_dividend)}</span></div>
              </div>
            </div>`;
          wrap.appendChild(card);
        });
      });
    }

    async function loadPage() {
      const st = document.getElementById('statusText');
      if (st) st.textContent = '加载组合中…';
      try {
        const p = await api('/portfolio');
        renderSummary(p);
        renderTable(p);
        renderCards(p);
        if (st) st.textContent = '';
      } catch (e) {
        if (st) st.textContent = '加载失败';
        document.getElementById('emptyTip').style.display = 'block';
        document.getElementById('holdingsGroups').innerHTML = '';
        document.getElementById('cardView').innerHTML = '';
        document.getElementById('summary').innerHTML = '';
      }
    }

    function renderSummary(p) {
      const pf = p.portfolio;
      const main = [
        ['总市值', '¥' + fmtNum(pf.total_value), null,
          pf.day_pnl != null ? '今日 ' + signed(pf.day_pnl) + ' 元 · ' + signed(pf.day_pnl_pct) + '%' : '', cls(pf.day_pnl)],
        ['总成本', '¥' + fmtNum(pf.total_cost)],
        ['总盈亏', fmtNum(pf.pnl) + ' 元', cls(pf.pnl)],
        ['盈亏%', fmtPct(pf.pnl_pct), cls(pf.pnl_pct)],
      ];
      const sub = [
        ['PE分位', fmtPct(pf.pe_pct)],
        ['PB分位', fmtPct(pf.pb_pct)],
        ['年化波动率', fmtPct(pf.volatility)],
        ['累计已收分红', '¥' + fmtNum(pf.total_dividend)],
      ];
      const card = ([l, v, c, note, noteCls]) =>
        `<div class="card"><div class="label">${l}</div><div class="value ${c || ''}">${v}</div>${note ? `<div class="label ${noteCls || ''}">${note}</div>` : ''}</div>`;
      document.getElementById('summary').innerHTML = `
        <div class="cards summary-main" style="margin-bottom:8px;grid-column:1/-1">${main.map(card).join('')}</div>
        <div class="cards summary-sub" style="grid-column:1/-1">${sub.map(card).join('')}</div>`;
    }

    function sortedStocks(stocks) {
      const arr = stocks.slice();
      if (sortMode === 'weight_asc') arr.sort((a, b) => a.weight - b.weight);
      else if (sortMode === 'tag') arr.sort((a, b) => (a.tag || '').localeCompare(b.tag || '') || b.weight - a.weight);
      else if (sortMode === 'code') arr.sort((a, b) => a.code.localeCompare(b.code));
      else arr.sort((a, b) => b.weight - a.weight);
      return arr;
    }

    function groupByTag(stocks) {
      const groups = {};
      stocks.forEach((s) => {
        const t = s.tag || '其他';
        (groups[t] = groups[t] || []).push(s);
      });
      return groups;
    }

    function renderTable(p) {
      const wrap = document.getElementById('holdingsGroups');
      wrap.innerHTML = '';
      const groups = groupByTag(sortedStocks(p.stocks));
      Object.keys(groups).forEach((tag) => {
        const rows = groups[tag];
        const value = rows.reduce((s, x) => s + x.value, 0);
        const weight = rows.reduce((s, x) => s + x.weight, 0);
        const sec = document.createElement('div');
        sec.className = 'holdings-group';
        sec.innerHTML = `
          <h3>${tag} <span class="muted">${rows.length} 只 · 市值 ¥${fmtNum(value)} · 权重 ${fmtNum(weight)}%</span></h3>
          <div style="overflow-x:auto">
            <table>
              <thead><tr>
                <th>代码/名称</th><th>现价</th><th>数量</th><th>成本</th><th>市值</th>
                <th>盈亏</th><th>盈亏%</th><th>今日盈亏</th><th>PE</th><th>PB</th>
                <th>PE分位</th><th>PB分位</th><th>股息率</th><th>累计分红</th><th>权重</th>
              </tr></thead>
              <tbody>${rows.map((s) => `
                <tr>
                  <td><a href="/static/stock.html?code=${s.code}">${s.code}</a> ${s.name} <span class="tag-badge edittag" data-edittag="${s.code}" title="点击修改标签">${s.tag || ''}</span></td>
                  <td>${fmtNum(s.price)}</td>
                  <td>${fmtNum(s.quantity)}</td>
                  <td>${fmtNum(s.avg_cost)}</td>
                  <td>${fmtNum(s.value)}</td>
                  <td class="${cls(s.pnl)}">${signed(s.pnl)}</td>
                  <td class="${cls(s.pnl_pct)}">${signed(s.pnl_pct)}%</td>
                  <td class="${cls(s.day_pnl)}">${signed(s.day_pnl)}</td>
                  <td>${fmtNum(s.pe)}</td>
                  <td>${fmtNum(s.pb)}</td>
                  <td>${fmtNum(s.pe_pct)}%</td>
                  <td>${fmtNum(s.pb_pct)}%</td>
                  <td>${fmtNum(s.dv)}%</td>
                  <td>¥${fmtNum(s.total_dividend)}</td>
                  <td>${fmtNum(s.weight)}%</td>
                </tr>`).join('')}
              </tbody>
            </table>
          </div>`;
        wrap.appendChild(sec);
      });
      document.getElementById('emptyTip').style.display = p.stocks.length ? 'none' : 'block';
    }

    document.getElementById('sortSel').addEventListener('change', (e) => {
      sortMode = e.target.value;
      loadPage();
    });
    setupViewToggle();
    loadPage();
  </script>
</body>
</html>
