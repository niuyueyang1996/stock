<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>交易评分 · 自建ETF</title>
  <link rel="stylesheet" href="/static/css/style.css">
  <script src="/static/vendor/echarts.min.js"></script>
</head>
<body>
  <nav></nav>
  <div class="container">
    <div class="panel">
      <h2 id="formTitle">录入交易</h2>
      <div class="row">
        <div id="searchBox"></div>
        <input type="file" id="importFile" accept=".xlsx" style="display:none" onchange="importExcel()">
        <button class="btn" id="importBtn" onclick="document.getElementById('importFile').click()">📥 一键导入持仓Excel</button>
        <select id="side">
          <option value="buy">买入</option>
          <option value="sell">卖出</option>
        </select>
        <input type="number" id="price" placeholder="成交价" step="0.001" min="0" style="width:100px">
        <input type="number" id="quantity" placeholder="数量" step="1" min="0" style="width:90px">
        <input type="number" id="fee" placeholder="费用" step="0.01" min="0" value="0" style="width:90px">
        <input type="datetime-local" id="tradeTime" style="width:190px">
        <input type="text" id="note" placeholder="备注" style="width:140px">
        <button class="btn primary" id="submitBtn" onclick="submitTrade()">提交</button>
        <button class="btn" id="cancelBtn" style="display:none" onclick="cancelEdit()">取消编辑</button>
        <button class="btn" id="adjustBtn" onclick="openCostAdjust()" title="直接调整持仓成本：补记漏记 / 分红除权摊薄">💰 调整成本</button>
        <button class="btn" id="aiScoreTodayBtn" onclick="aiScoreToday()" title="请求 AI 对今天录制的交易打分">🤖 AI 打分(今日)</button>
      </div>
      <div class="muted" id="formTip" style="margin-top:8px">
        录入买卖操作自动更新持仓（移动加权成本），新交易会由 AI 对该日自动打分（也可手动「🤖 AI 打分(今日)」）。空仓时可用「📥 一键导入持仓Excel」从汇总持仓.xlsx 恢复持仓。
      </div>
      <div id="importProgress" style="display:none;margin-top:10px">
        <div style="display:flex;justify-content:space-between;align-items:center;font-size:13px;margin-bottom:4px">
          <span id="importProgressText">正在导入…</span>
          <span id="importProgressPct" class="muted">0%</span>
        </div>
        <div class="progress-track"><div class="progress-fill" id="importProgressBar"></div></div>
      </div>
    </div>

    <div class="panel" style="padding:0;overflow:hidden">
      <div class="row" style="align-items:stretch;gap:0;margin:0;height:70vh;flex-wrap:nowrap">
        <!-- 左：日期目录栏（可滚动） -->
        <div id="dayDir" class="day-dir">
          <div class="day-dir-title">综合评分历史</div>
        </div>
        <!-- 右：选中日详情（可滚动） -->
        <div id="dayDetail" class="day-detail">
          <div class="empty" style="padding:60px">加载中…</div>
        </div>
      </div>
    </div>

    <div class="panel">
      <h2>交易流水 <span class="sub">可修改 / 撤销</span></h2>
      <div style="overflow-x:auto">
        <table>
          <thead>
            <tr><th>时间</th><th>代码/名称</th><th>方向</th><th>价格</th><th>数量</th><th>金额(¥)</th><th>费用</th><th>备注</th><th>操作</th></tr>
          </thead>
          <tbody id="tradeBody"></tbody>
        </table>
      </div>
      <div class="empty" id="tradeEmpty" style="display:none;padding:20px">暂无交易，先在上方录入。</div>
    </div>
  </div>

  <script src="/static/js/api.js"></script>
  <script src="/static/js/common.js"></script>
  <script src="/static/js/charts.js"></script>
  <script>
    initNav('trade');
    let editingId = null;
    let lastTrades = [];

    // 默认时间 = 现在
    function nowLocal() {
      const d = new Date();
      d.setSeconds(0, 0);
      const pad = (n) => String(n).padStart(2, '0');
      return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}T${pad(d.getHours())}:${pad(d.getMinutes())}`;
    }
    document.getElementById('tradeTime').value = nowLocal();

    const sb = stockSearchInput();
    document.getElementById('searchBox').appendChild(sb);

    // 今日 AI 打分按钮
    async function aiScoreToday() {
      const d = new Date();
      const pad = (n) => String(n).padStart(2, '0');
      const date = `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
      await scoreDay(date);
    }

    // 对某日执行 AI 打分（一次调用逐笔+汇总；先弹窗确认/编辑指令）
    function scoreDay(date) {
      openPromptEditor('daily', async (systemPrompt, intensity) => {
        const btn = document.getElementById('aiScoreTodayBtn');
        if (btn) btn.disabled = true;
        try {
          const body = { date, intensity };
          if (systemPrompt) body.system_prompt = systemPrompt;
          const d = await api('/ai-scoring/daily', { method: 'POST', body, blocking: true });
          _day = d.day;
          _aiReport = d.report;
          _aiConfigured = true;
          activeDate = date;
          renderDayDir();
          renderDayDetail();
          toast(`AI 打分完成：${d.report.score} 分（${d.report.rating}）`);
        } catch (e) {
          toast('AI 打分失败：' + e.message, 5000);
        } finally {
          if (btn) btn.disabled = false;
        }
      });
    }

    async function submitTrade() {
      const stock = parseStockChoice(sb.querySelector('input').value);
      if (!stock) return toast('请选择股票（代码或 代码 名称）');
      const body = {
        code: stock.code, name: stock.name,
        side: document.getElementById('side').value,
        price: parseFloat(document.getElementById('price').value),
        quantity: parseFloat(document.getElementById('quantity').value),
        fee: parseFloat(document.getElementById('fee').value) || 0,
        note: document.getElementById('note').value || null,
      };
      if (!body.price || !body.quantity) return toast('请填写价格与数量');
      const t = document.getElementById('tradeTime').value;
      if (t) body.trade_time = t.replace('T', ' ') + ':00';
      try {
        if (editingId) {
          await api('/trades/' + editingId, { method: 'PUT', body });
        } else {
          await api('/trades', { method: 'POST', body });
        }
        toast(editingId ? '已修改交易' : '已录入交易');
        cancelEdit();
        await loadPage();
      } catch (e) {
        toast('失败：' + e.message, 4000);
      }
    }

    // ============ Excel 导入进度条（同步阻塞 + NDJSON 流式） ============
    function setImportBar(show, text, pct) {
      const btn = document.getElementById('importBtn');
      if (btn) btn.disabled = show;
      const bar = document.getElementById('importProgress');
      if (!bar) return;
      bar.style.display = show ? 'block' : 'none';
      document.getElementById('importProgressText').textContent = text || '';
      document.getElementById('importProgressPct').textContent = pct == null ? '' : Math.round(pct) + '%';
      const fill = document.getElementById('importProgressBar');
      fill.style.width = (pct == null ? 0 : pct) + '%';
      fill.classList.remove('error');
    }

    async function importExcel() {
      const input = document.getElementById('importFile');
      const file = input.files && input.files[0];
      if (!file) return;
      const fd = new FormData();
      fd.append('file', file);
      setImportBar(true, '正在上传解析 Excel…', 0);
      try {
        const res = await fetch('/api/holdings/import-excel', { method: 'POST', body: fd });
        if (!res.ok) {
          const j = await res.json().catch(() => ({}));
          throw new Error(j.detail || j.msg || `HTTP ${res.status}`);
        }
        // 逐行读 NDJSON 流，实时刷新进度（每行一只，done 从 0 数到 total）
        const reader = res.body.getReader();
        const decoder = new TextDecoder();
        let buf = '';
        let doneMsg = null;
        let errorMsg = null;
        for (;;) {
          const { done, value } = await reader.read();
          if (done) break;
          buf += decoder.decode(value, { stream: true });
          let idx;
          while ((idx = buf.indexOf('\n')) >= 0) {
            const line = buf.slice(0, idx).trim();
            buf = buf.slice(idx + 1);
            if (!line) continue;
            let m;
            try { m = JSON.parse(line); } catch (e) { continue; }
            if (m.status === 'importing') {
              const pct = m.total ? (m.done / m.total * 100) : 0;
              setImportBar(true, `正在导入 ${m.done}/${m.total}${m.current ? '：' + m.current : ''}…`, pct);
            } else if (m.status === 'done') {
              doneMsg = m;
            } else if (m.status === 'error') {
              errorMsg = m;
            }
          }
        }
        input.value = '';
        setImportBar(false);
        if (errorMsg) {
          toast('导入失败：' + errorMsg.error, 5000);
        } else if (doneMsg) {
          const imported = doneMsg.imported || 0;
          toast(`已导入 ${imported} 只持仓` + (doneMsg.skipped ? `，跳过 ${doneMsg.skipped} 只（非A股/无价格）` : ''), 3500);
        }
        await loadPage();
      } catch (e) {
        setImportBar(false);
        input.value = '';
        toast('导入失败：' + e.message, 4000);
      }
    }

    function editTrade(id) {
      const t = lastTrades.find((x) => x.id === id);
      if (!t) return;
      editingId = t.id;
      sb.querySelector('input').value = `${t.code}`;
      document.getElementById('side').value = t.side;
      document.getElementById('price').value = t.price;
      document.getElementById('quantity').value = t.quantity;
      document.getElementById('fee').value = t.fee || 0;
      document.getElementById('note').value = t.note || '';
      const dt = (t.trade_time || '').replace(' ', 'T').slice(0, 16);
      if (dt) document.getElementById('tradeTime').value = dt;
      document.getElementById('formTitle').textContent = '修改交易 #' + t.id;
      document.getElementById('submitBtn').textContent = '保存修改';
      document.getElementById('cancelBtn').style.display = '';
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function cancelEdit() {
      editingId = null;
      document.getElementById('formTitle').textContent = '录入交易';
      document.getElementById('submitBtn').textContent = '提交';
      document.getElementById('cancelBtn').style.display = 'none';
      sb.querySelector('input').value = '';
      document.getElementById('side').value = 'buy';
      document.getElementById('price').value = '';
      document.getElementById('quantity').value = '';
      document.getElementById('fee').value = '0';
      document.getElementById('note').value = '';
    }

    async function deleteTrade(id, code) {
      if (!confirm(`撤销交易 #${id}（${code}）？将回滚持仓。`)) return;
      try {
        await api('/trades/' + id, { method: 'DELETE' });
        toast('已撤销');
        await loadPage();
      } catch (e) {
        toast('撤销失败：' + e.message, 4000);
      }
    }

    let activeDate = null;
    let _days = [];          // [{score_date, trades_count, net_amount, ai:{...}|null}]
    let _day = null;         // {score_date, trades_count, net_amount, trades:[...]}
    let _aiReport = null;    // 当日 AI 报告（含 trades 数组）
    let _aiConfigured = false;

    // 渲染左侧可滚动的日期目录栏（AI 评分 / 未评分）
    function renderDayDir() {
      const dir = document.getElementById('dayDir');
      dir.querySelectorAll('.day-tab').forEach((t) => t.remove());
      if (!_days.length) {
        dir.insertAdjacentHTML('beforeend',
          '<div class="muted" style="padding:14px;font-size:12px">暂无交易，先录入交易后 AI 打分</div>');
        return;
      }
      _days.forEach((h) => {
        const ai = h.ai;
        const tab = document.createElement('div');
        tab.className = 'day-tab' + (h.score_date === activeDate ? ' active' : '');
        tab.dataset.date = h.score_date;
        tab.innerHTML = `
          <div style="display:flex;align-items:center;gap:6px">
            <strong>${h.score_date}</strong>
            ${ai ? `<span class="badge ${ai.rating || 'N'}">${ai.rating || 'N/A'}</span>` : '<span class="badge N">未评分</span>'}
            <span class="grow"></span>
            <span style="font-weight:700">${ai ? (ai.score == null ? '—' : ai.score) : '—'}</span>
          </div>
          <div class="muted" style="font-size:11px;margin-top:2px">${h.trades_count} 笔 · 净${h.net_amount >= 0 ? '买' : '卖'} ${fmtNum(Math.abs(h.net_amount))} 元</div>`;
        tab.onclick = () => selectDay(h.score_date);
        dir.appendChild(tab);
      });
    }

    // 点击左侧某天 → 加载并渲染右侧详情
    async function selectDay(date) {
      activeDate = date;
      document.querySelectorAll('#dayDir .day-tab').forEach((t) => {
        t.classList.toggle('active', t.dataset.date === date);
      });
      document.getElementById('dayDetail').innerHTML = '<div class="empty" style="padding:60px">加载中…</div>';
      try {
        const d = await api('/ai-scoring/daily?date=' + date, { silent: true });
        _aiConfigured = d.configured;
        _day = d.day;
        _aiReport = d.report;
        renderDayDetail();
      } catch (e) {
        _day = null; _aiReport = null;
        renderDayDetail();
      }
    }

    // 渲染右侧选中日的完整详情（AI 综合分 + 分析 + 每笔明细）
    function renderDayDetail() {
      const el = document.getElementById('dayDetail');
      if (!_day || !_day.trades_count) {
        el.innerHTML = '<div class="empty" style="padding:60px">该日无交易</div>';
        return;
      }
      if (!_aiConfigured) {
        el.innerHTML = aiNotConfiguredHtml() + `<h3 style="margin:14px 0 8px">每笔明细</h3>` + _dayTableHtml(null);
        return;
      }
      const dir = _day.net_amount >= 0 ? '净买入' : '净卖出';
      const r = _aiReport;
      const header = r ? `
        <div class="row" style="align-items:center;margin-bottom:14px;gap:12px">
          <h2 style="margin:0">${_day.score_date} AI 综合评分</h2>
          <span class="grow"></span>
          <span class="badge ${r.rating || 'N'}">${r.rating || 'N/A'} ${esc(r.rating_name || '')}</span>
        </div>
        <div class="row" style="align-items:center;gap:28px;margin-bottom:12px">
          <div style="font-size:52px;font-weight:700;line-height:1">${r.score == null ? '—' : r.score}</div>
          <div class="muted" style="font-size:13px;line-height:1.9">
            ${_day.trades_count} 笔交易 · ${dir} ${fmtNum(Math.abs(_day.net_amount))} 元
          </div>
        </div>
        ${aiScoreHeader(r)}
        ${renderAiReportBlock(r)}` : `
        <div class="row" style="align-items:center;margin-bottom:14px;gap:12px">
          <h2 style="margin:0">${_day.score_date} 交易</h2>
          <span class="grow"></span>
          <span class="badge N">未评分</span>
        </div>
        <div class="muted" style="font-size:13px;margin-bottom:12px">该日尚未 AI 评分。</div>`;
      el.innerHTML = header + `
        <div style="margin:12px 0">${aiScoreButtonHtml(r ? '重新打分' : '🤖 AI 打分')}</div>
        <h3 style="margin:10px 0 8px">每笔明细</h3>
        ${_dayTableHtml(r)}`;
      const btn = el.querySelector('[data-aiscore-btn]');
      if (btn) btn.onclick = () => scoreDay(_day.score_date);
      if (r) wireAiHtmlButton(el, r);
    }

    // 每笔明细表：交易字段 + AI单笔分/评级/AI评论（来自报告 trades 数组）
    function _dayTableHtml(report) {
      const rows = _day.trades || [];
      if (!rows.length) return '<div class="empty" style="padding:20px">该日无买卖交易</div>';
      const byId = {};
      ((report && report.trades) || []).forEach((t) => { byId[t.trade_id] = t; });
      return `<div style="overflow-x:auto">
        <table>
          <thead><tr><th>时间</th><th>代码/名称</th><th>标签</th><th>方向</th><th>价格</th><th>数量</th><th>金额(¥)</th><th>AI单笔分</th><th>评级</th><th>AI评论</th></tr></thead>
          <tbody>${rows.map((d) => {
            const sideText = d.side === 'buy' ? '买入' : '卖出';
            const sideCls = d.side === 'buy' ? 'up' : 'down';
            const isHk = /^\d{5}$/.test(d.code);           // 港股：价格港币、金额人民币
            const amtCny = d.amount_cny != null ? d.amount_cny : d.amount;
            const ai = byId[d.trade_id];
            return `<tr>
              <td>${(d.trade_time || '').slice(11) || ''}</td>
              <td><a href="/static/stock.html?code=${d.code}">${esc(d.name || d.code)}</a>${isHk ? '<span class="muted" style="font-size:10px"> 港</span>' : ''}</td>
              <td><span class="tag-badge">${esc(d.tag || '')}</span></td>
              <td class="${sideCls}">${sideText}</td>
              <td>${fmtNum(d.price)}${isHk ? '<span class="muted" style="font-size:10px"> 港币</span>' : ''}</td>
              <td>${fmtNum(d.quantity)}</td>
              <td>${fmtNum(amtCny)}</td>
              <td>${ai ? (ai.score == null ? '—' : fmtNum(ai.score)) : '—'}</td>
              <td>${ai ? `<span class="badge ${ai.rating || 'N'}">${ai.rating || 'N/A'}</span>` : ''}</td>
              <td class="muted" style="max-width:280px;min-width:120px">${ai ? esc(ai.comment || '') : ''}</td>
            </tr>`;
          }).join('')}</tbody>
        </table>
      </div>`;
    }

    function renderTrades(trades) {
      lastTrades = trades;
      const body = document.getElementById('tradeBody');
      const empty = document.getElementById('tradeEmpty');
      body.innerHTML = '';
      empty.style.display = trades.length ? 'none' : 'block';
      trades.forEach((t) => {
        const tr = document.createElement('tr');
        const isAdj = t.side === 'adjust';
        const isHk = t.currency === 'HKD';
        const sideLabel = t.side === 'buy' ? '买入' : t.side === 'sell' ? '卖出' : '除权/调成本';
        const sideCls = t.side === 'buy' ? 'up' : t.side === 'sell' ? 'down' : 'muted';
        // 金额统一人民币（港股 amount_cny）
        const amtCny = t.amount_cny != null ? t.amount_cny : t.amount;
        tr.innerHTML = `
          <td>${(t.trade_time || '').split('.')[0]}</td>
          <td><a href="/static/stock.html?code=${t.code}">${t.name || t.code}</a>${isHk ? '<span class="muted" style="font-size:10px"> 港</span>' : ''}</td>
          <td class="${sideCls}">${sideLabel}</td>
          <td>${isAdj ? '—' : fmtNum(t.price) + (isHk ? '<span class="muted" style="font-size:10px"> 港币</span>' : '')}</td>
          <td>${isAdj ? '—' : fmtNum(t.quantity)}</td>
          <td class="${isAdj ? (amtCny < 0 ? 'down' : 'up') : ''}">${isAdj ? signed(amtCny) : fmtNum(amtCny)}</td>
          <td>${fmtNum(t.fee)}</td>
          <td class="muted">${t.note || (isAdj ? '成本调整' : '')}</td>
          <td>
            <button class="btn" onclick="editTrade(${t.id})">改</button>
            <button class="btn danger" onclick="deleteTrade(${t.id},'${t.code}')">删</button>
          </td>`;
        body.appendChild(tr);
      });
    }

    // 调整持仓弹窗：调整每股（成本）与/或调整股数（拆股/送股）；「分红除权」自动查最近除权填入
    let adjustStock = null;
    let adjustHoldQty = 0;
    function updateAdjustTotal() {
      const per = parseFloat(document.getElementById('adjustPerShare').value) || 0;
      const total = per * (adjustHoldQty || 0);
      document.getElementById('adjustTotalInfo').textContent =
        `持仓 ${adjustHoldQty || 0} 股 × 每股 ${per} 元 = 总调整 ${total.toFixed(2)} 元`;
    }
    async function openCostAdjust() {
      const mask = document.createElement('div');
      mask.className = 'modal-mask';
      mask.innerHTML = `
        <div class="modal">
          <h3>💰 调整持仓</h3>
          <div class="row" style="align-items:center">
            <div id="adjustSearch"></div>
            <span class="muted" id="adjustHolding"></span>
          </div>
          <div class="row" style="margin-top:10px;align-items:center">
            <span class="muted">调整每股(元)</span>
            <input type="number" id="adjustPerShare" step="0.001" style="width:140px" placeholder="正=加成本 负=减成本"
                   oninput="this.dataset.dividend='';updateAdjustTotal()">
            <button class="btn" id="adjustDivBtn" onclick="fillDividend()">📅 分红除权</button>
          </div>
          <div class="muted" id="adjustTotalInfo" style="margin-top:6px;font-size:12px"></div>
          <div id="adjustDivInfo" class="muted" style="margin-top:6px;font-size:12px"></div>
          <div class="row" style="margin-top:10px;align-items:center">
            <span class="muted">调整股数</span>
            <input type="number" id="adjustQty" step="1" style="width:140px" placeholder="拆股/送股：正=加股 负=减股">
          </div>
          <input type="text" id="adjustNote" placeholder="备注（如：1拆2 / 分红除权）" style="width:100%;margin-top:8px">
          <div class="modal-actions">
            <button class="btn" id="adjustCancel">取消</button>
            <button class="btn primary" id="adjustOk">确认调整</button>
          </div>
        </div>`;
      document.body.appendChild(mask);
      const close = () => mask.remove();
      mask.querySelector('#adjustCancel').onclick = close;
      mask.addEventListener('click', (e) => { if (e.target === mask) close(); });
      // 股票搜索
      const sb = stockSearchInput();
      mask.querySelector('#adjustSearch').appendChild(sb);
      sb.querySelector('input').addEventListener('change', async () => {
        const p = parseStockChoice(sb.querySelector('input').value);
        adjustStock = p ? p.code : null;
        adjustHoldQty = 0;
        if (adjustStock) {
          try {
            const h = (await api('/holdings')).find((x) => x.code === adjustStock);
            adjustHoldQty = h ? h.quantity : 0;
            mask.querySelector('#adjustHolding').textContent = h
              ? `持仓 ${h.quantity} 股 · 成本 ${fmtNum(h.avg_cost)}`
              : '（当前无持仓，无法调整）';
            updateAdjustTotal();
          } catch (e) { /* ignore */ }
        }
      });
      // 确认：按「每股调整值 × 当前持仓」计算总额
      mask.querySelector('#adjustOk').onclick = async () => {
        if (!adjustStock) return toast('请先搜索选择股票');
        const perShare = parseFloat(mask.querySelector('#adjustPerShare').value) || 0;
        const deltaQty = parseFloat(mask.querySelector('#adjustQty').value) || 0;
        const amount = perShare * (adjustHoldQty || 0);
        if (!amount && !deltaQty) return toast('请填写每股调整值或调整股数');
        const note = mask.querySelector('#adjustNote').value.trim();
        // 若每股值是「分红除权」按钮填入的，标记为除权（计入累计分红）
        const isDividend = mask.querySelector('#adjustPerShare').dataset.dividend === '1';
        try {
          await api('/holdings/' + adjustStock + '/cost-adjust', {
            method: 'POST', body: { amount: Math.round(amount * 100) / 100, delta_qty: deltaQty, note, is_dividend: isDividend },
          });
          toast('已调整');
          close();
          loadPage();
        } catch (e) {
          toast('调整失败：' + e.message, 4000);
        }
      };
    }

    // 手动查最近除权：调 /stocks/{code}/dividend，填入「每股摊薄值」，并标记为除权
    async function fillDividend() {
      const perEl = document.getElementById('adjustPerShare');
      const infoEl = document.getElementById('adjustDivInfo');
      if (!adjustStock) { infoEl.textContent = '请先搜索选择股票'; return; }
      try {
        infoEl.textContent = '查询中…';
        const d = await api('/stocks/' + adjustStock + '/dividend');
        if (!adjustHoldQty) { infoEl.textContent = '当前无持仓，无法按除权填值'; return; }
        perEl.value = (-d.per_share).toFixed(4);   // 每股摊薄值（负）
        perEl.dataset.dividend = '1';              // 标记本次为除权，计入累计分红
        updateAdjustTotal();
        infoEl.textContent = `${d.ex_date} 除权（${d.report_date}分红）· 每股分红 ${d.per_share} 元 → 摊薄 ${(-d.per_share).toFixed(4)} 元/股`;
      } catch (e) {
        infoEl.textContent = '查不到除权信息：' + e.message;
      }
    }

    async function loadPage() {
      try {
        const [daysData, trades] = await Promise.all([
          api('/ai-scoring/daily-reports', { blocking: true }),
          api('/trades', { blocking: true }),
        ]);
        _days = (daysData && daysData.days) || [];
        _aiConfigured = !!(daysData && daysData.configured);
        renderTrades(trades);
        renderDayDir();
        if (_days.length) {
          activeDate = _days[0].score_date;
          await selectDay(activeDate);
        } else {
          document.getElementById('dayDetail').innerHTML =
            '<div class="empty" style="padding:60px">暂无交易，先在上方录入交易</div>';
        }
      } catch (e) {
        toast('加载失败：' + e.message);
      }
    }

    loadPage();
  </script>
</body>
</html>
