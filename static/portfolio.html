<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>组合分析 · 自建ETF</title>
  <link rel="stylesheet" href="/static/css/style.css">
  <script src="/static/vendor/echarts.min.js"></script>
</head>
<body>
  <nav></nav>
  <div class="container">
    <div class="cards" id="summary"></div>
    <div class="period-tabs" id="tagTabs" style="justify-content:center"></div>
    <div class="panel" id="pfGrowthPanel">
      <h2>盈利与成长（组合） <span class="sub">静态 / TTM / 前瞻</span></h2>
      <table>
        <thead><tr><th>指标</th><th>静态</th><th>TTM</th><th>前瞻</th></tr></thead>
        <tbody id="pfGrowthBody"></tbody>
      </table>
    </div>
    <div class="panel" id="scorePanel" style="display:none">
      <h2>组合动态打分 <span class="sub">界面指标加权，缺失因子自动归一化；分散度权重暂为 0</span></h2>
      <div class="chart sm" id="scoreFactorChart" style="height:280px"></div>
    </div>
    <div class="panel" id="gaugePanel">
      <h2>综合估值分位（1y，穿透式打包序列）</h2>
      <div style="display:flex;gap:20px;flex-wrap:wrap">
        <div class="chart sm" id="peGauge" style="flex:1;min-width:280px"></div>
        <div class="chart sm" id="pbGauge" style="flex:1;min-width:280px"></div>
      </div>
    </div>
    <div class="panel" id="seriesPanel">
      <h2>组合综合 PE/PB 序列 <span class="sub">市值加权打包 · 可拖动缩放，分位随可见窗口变化</span></h2>
      <div id="seriesTabs"></div>
      <div class="chart lg" id="peSeriesLine" style="height:340px"></div>
      <div class="chart lg" id="pbSeriesLine" style="height:340px"></div>
      <div class="empty" id="seriesEmpty" style="display:none;padding:20px">
        暂无组合估值序列（请先「全量刷新」拉取历史序列）。
      </div>
    </div>
    <div class="panel" id="chartRow">
      <h2>权重分布（按标签）</h2>
      <div class="chart sm" id="weightChart" style="height:340px"></div>
    </div>
    <div class="panel" id="peBarPanel">
      <h2>各持仓估值分位（1y）<span class="sub">绿=低估(&le;25) 红=高估(&ge;75) · 无基本面(ETF/港股)不显示</span></h2>
      <div class="row" style="align-items:stretch">
        <div class="chart sm" id="peBars" style="flex:1;min-width:280px;height:420px"></div>
        <div class="chart sm" id="pbBars" style="flex:1;min-width:280px;height:420px"></div>
      </div>
    </div>
    <div class="panel" id="tablePanel">
      <div class="row">
        <h2 style="margin:0">逐股贡献</h2>
        <select id="pfSortSel" title="排序">
          <option value="weight_desc">权重降序</option>
          <option value="weight_asc">权重升序</option>
          <option value="tag">按标签</option>
          <option value="code">按代码</option>
        </select>
      </div>
      <div style="overflow-x:auto">
        <table>
          <thead>
            <tr><th>代码/名称</th><th>权重</th><th>市值</th><th>盈亏</th><th>盈亏%</th><th>今日盈亏</th><th>PE</th><th>PB</th>
                <th>PE分位</th><th>PB分位</th><th>股息率</th><th>ROE</th></tr>
          </thead>
          <tbody id="stockBody"></tbody>
        </table>
      </div>
      <div class="empty" id="emptyTip" style="display:none">
        暂无数据。请先在交易页录入持仓并点「全量刷新」。
      </div>
    </div>
    <div id="tagView" style="display:none"></div>
  </div>

  <script src="/static/js/api.js"></script>
  <script src="/static/js/common.js"></script>
  <script src="/static/js/charts.js"></script>
  <script>
    initNav('portfolio');
    let activeTag = '全部';
    let lastPortfolio = null;
    let pfGrowthMode = 'ttm';
    let tagGrowthMode = 'ttm';
    let pfSortMode = 'weight_desc';
    let tagSortMode = 'weight_desc';

    async function loadPage() {
      try {
        const p = await api('/portfolio', { blocking: true });
        lastPortfolio = p;
        renderTagTabs(p);
        renderSummary(p);
        renderPfGrowth(p.portfolio);
        renderScore(p);
        renderGauges(p);
        renderCharts(p);
        renderTable(p);
        renderSeries(p);
        showView(activeTag);
      } catch (e) {
        document.getElementById('emptyTip').style.display = 'block';
      }
    }

    function renderTagTabs(p) {
      const wrap = document.getElementById('tagTabs');
      wrap.innerHTML = '';
      const tags = ['全部', ...(p.tags || []).map((t) => t.tag)];
      tags.forEach((tag) => {
        const b = document.createElement('button');
        b.type = 'button';
        b.className = 'ptab' + (tag === activeTag ? ' active' : '');
        b.textContent = tag;
        b.onclick = () => { activeTag = tag; loadPage(); };
        wrap.appendChild(b);
      });
    }

    function showView(tag) {
      const all = tag === '全部';
      ['pfGrowthPanel', 'scorePanel', 'gaugePanel', 'seriesPanel', 'chartRow', 'peBarPanel', 'tablePanel'].forEach((id) => {
        const el = document.getElementById(id);
        if (el) el.style.display = all ? '' : 'none';
      });
      document.getElementById('summary').style.display = all ? '' : 'none';
      document.getElementById('tagView').style.display = all ? 'none' : '';
      if (!all) renderTagView(tag);
    }

    function renderTagView(tag) {
      const p = lastPortfolio;
      const section = (p.tags || []).find((t) => t.tag === tag);
      if (!section) return;
      const el = document.getElementById('tagView');
      el.innerHTML = `
        <div class="cards" id="tagCards"></div>
        <div class="panel">
          <h2>盈利与成长（${tag}） <span class="sub">静态 / TTM / 前瞻</span></h2>
          <table>
            <thead><tr><th>指标</th><th>静态</th><th>TTM</th><th>前瞻</th></tr></thead>
            <tbody id="tagGrowthBody"></tbody>
          </table>
        </div>
        <div class="panel">
          <h2>权重分布（${tag}）</h2>
          <div class="chart sm" id="tagWeightChart" style="height:340px"></div>
        </div>
        <div class="panel">
          <h2>各持仓 PE 分位（${tag}）<span class="sub">绿=低估(&le;25) 红=高估(&ge;75)</span></h2>
          <div class="chart sm" id="tagPeChart" style="height:420px"></div>
        </div>
        <div class="panel">
          <div class="row">
            <h2 style="margin:0">${tag} 明细</h2>
            <select id="tagSortSel" title="排序">
              <option value="weight_desc">权重降序</option>
              <option value="weight_asc">权重升序</option>
              <option value="tag">按标签</option>
              <option value="code">按代码</option>
            </select>
          </div>
          <div style="overflow-x:auto">
            <table>
              <thead><tr><th>代码/名称</th><th>权重</th><th>市值</th><th>盈亏</th><th>盈亏%</th><th>今日盈亏</th><th>PE</th><th>PB</th><th>PE分位</th><th>PB分位</th><th>股息率</th><th>ROE</th></tr></thead>
              <tbody id="tagStockBody"></tbody>
            </table>
          </div>
        </div>`;

      const cards = [
        ['标签', section.tag],
        ['持仓数', section.stocks_count],
        ['总市值', '¥' + fmtNum(section.total_value)],
        ['总成本', '¥' + fmtNum(section.total_cost)],
        ['盈亏', fmtNum(section.pnl) + ' 元', cls(section.pnl)],
        ['盈亏%', fmtPct(section.pnl_pct), cls(section.pnl_pct)],
        ['组合权重', fmtPct(section.weight)],
        ['综合PE', fmtNum(section.pe)],
        ['综合PB', fmtNum(section.pb)],
        ['股息率', fmtPct(section.dv)],
        ['ROE', fmtPct(section.roe)],
        ['净利增长', fmtPct(section.profit_yoy)],
      ];
      document.getElementById('tagCards').innerHTML = cards.map(([l, v, c]) =>
        `<div class="card"><div class="label">${l}</div><div class="value small ${c || ''}">${v}</div></div>`).join('');
      renderTagGrowth(section);

      if (section.stocks.length) {
        weightPie(
          document.getElementById('tagWeightChart'),
          section.stocks.map((s) => ({ name: s.name, value: s.value })),
          '',
        );
      }
      const peItems = section.stocks
        .filter((s) => s.pe_pct !== null && s.pe_pct !== undefined)
        .map((s) => ({ name: s.name, value: s.pe_pct }))
        .sort((a, b) => b.value - a.value);
      if (peItems.length) quantileBars(document.getElementById('tagPeChart'), peItems, 'PE 分位(1y)');

      const table = el.querySelector('#tagStockBody').closest('table');
      const body = document.getElementById('tagStockBody');
      const rows = sortedStocks(section.stocks, tagSortMode);
      body.innerHTML = rows.map((s) => `
        <tr>
          <td><a href="/static/stock.html?code=${s.code}">${s.code}</a> ${s.name} ${s.is_etf ? '<span class="tag-badge">ETF</span>' : ''}</td>
          <td>${fmtNum(s.weight)}%</td>
          <td>${fmtNum(s.value)}</td>
          <td class="${cls(s.pnl)}">${signed(s.pnl)}</td>
          <td class="${cls(s.pnl_pct)}">${signed(s.pnl_pct)}%</td>
          <td class="${cls(s.day_pnl)}">${signed(s.day_pnl)}</td>
          <td>${fmtNum(s.pe)}</td>
          <td>${fmtNum(s.pb)}</td>
          <td>${fmtNum(s.pe_pct)}%</td>
          <td>${fmtNum(s.pb_pct)}%</td>
          <td>${fmtNum(s.dv)}%</td>
          <td>${fmtNum(s.roe)}%</td>
        </tr>`).join('');
      const oldFoot = table.querySelector('tfoot');
      if (oldFoot) oldFoot.remove();
      if (rows.length) table.appendChild(Object.assign(document.createElement('tfoot'), { innerHTML: sumRow(rows) }));
      const sel = document.getElementById('tagSortSel');
      if (sel) {
        sel.addEventListener('change', (e) => {
          tagSortMode = e.target.value;
          renderTagView(activeTag);
        });
      }
    }

    function renderTagGrowth(section) {
      const body = document.getElementById('tagGrowthBody');
      if (!body) return;
      const rows = [
        ['ROE', section.roe_static, section.roe, section.fwd_roe, 'pct'],
        ['营收增长', section.revenue_yoy_static, section.revenue_yoy, section.fwd_revenue_yoy, 'pct'],
        ['净利增长', section.profit_yoy_static, section.profit_yoy, section.fwd_profit_yoy, 'pct'],
        ['PE', section.pe_static, section.pe, section.fwd_pe, 'num'],
        ['PB', section.pb_static, section.pb, section.fwd_pb, 'num'],
        ['股息率', section.dv_static, section.dv, section.fwd_dv_ratio, 'pct'],
        ['市销率', section.ps_static, section.ps_ttm, section.ps_fwd, 'num'],
      ];
      body.innerHTML = rows.map(([name, a, b, c, kind]) => {
        const fmt = (v) => (v == null ? '—' : kind === 'pct' ? fmtPct(v) : fmtNum(v));
        return `<tr><td>${name}</td><td>${fmt(a)}</td><td>${fmt(b)}</td><td>${fmt(c)}</td></tr>`;
      }).join('');
    }

    function renderSummary(p) {
      const pf = p.portfolio;
      const main = [
        ['组合打分', (pf.score == null ? '—' : fmtNum(pf.score)) + (pf.score_rating ? ' ' + pf.score_rating : '')],
        ['总市值', '¥' + fmtNum(pf.total_value), null,
          pf.day_pnl != null ? '今日 ' + signed(pf.day_pnl) + ' 元 · ' + signed(pf.day_pnl_pct) + '%' : '', cls(pf.day_pnl)],
        ['总成本', '¥' + fmtNum(pf.total_cost)],
        ['总盈亏', fmtNum(pf.pnl) + ' 元', cls(pf.pnl)],
        ['盈亏%', fmtPct(pf.pnl_pct), cls(pf.pnl_pct)],
      ];
      const sub = [
        ['PE分位(1y)', fmtPct(pf.pe_pct)],
        ['PB分位(1y)', fmtPct(pf.pb_pct)],
        ['年化波动率', fmtPct(pf.volatility), null, `样本 ${pf.volatility_sample_days} 交易日`],
        ['累计已收分红', '¥' + fmtNum(pf.total_dividend)],
      ];
      const card = ([l, v, c, note, noteCls]) =>
        `<div class="card"><div class="label">${l}</div><div class="value ${c || ''}">${v}</div>${note ? `<div class="label ${noteCls || ''}">${note}</div>` : ''}</div>`;
      document.getElementById('summary').innerHTML = `
        <div class="panel" style="grid-column:1/-1">
          <h3>简况</h3>
          <div class="cards summary-main" style="margin-bottom:8px">${main.map(card).join('')}</div>
          <div class="cards summary-sub">${sub.map(card).join('')}</div>
        </div>`;
    }

    function renderPfGrowth(pf) {
      const body = document.getElementById('pfGrowthBody');
      const rows = [
        ['ROE', pf.roe_static, pf.roe_ttm, pf.fwd_roe, 'pct'],
        ['营收增长', pf.revenue_yoy_static, pf.revenue_yoy_ttm, pf.fwd_revenue_yoy, 'pct'],
        ['净利增长', pf.profit_yoy_static, pf.profit_yoy_ttm, pf.fwd_profit_yoy, 'pct'],
        ['PE', pf.pe_static, pf.pe, pf.fwd_pe, 'num'],
        ['PB', pf.pb_static, pf.pb, pf.fwd_pb, 'num'],
        ['股息率', pf.dv_static, pf.dv, pf.fwd_dv_ratio, 'pct'],
        ['市销率', pf.ps_static, pf.ps_ttm, pf.ps_fwd, 'num'],
      ];
      body.innerHTML = rows.map(([name, a, b, c, kind]) => {
        const fmt = (v) => (v == null ? '—' : kind === 'pct' ? fmtPct(v) : fmtNum(v));
        return `<tr><td>${name}</td><td>${fmt(a)}</td><td>${fmt(b)}</td><td>${fmt(c)}</td></tr>`;
      }).join('');
    }

    function renderScore(p) {
      const panel = document.getElementById('scorePanel');
      const factors = p.portfolio.score_factors || [];
      panel.style.display = factors.length ? '' : 'none';
      if (!factors.length) return;
      const chart = initChart(document.getElementById('scoreFactorChart'));
      if (!chart) return;
      const pf = p.portfolio;
      // 只显示参与打分的因子（used=True），标签与条形严格一一对应
      const used = factors.filter((f) => f.used && f.score != null);
      const names = used.map((f) => f.name);
      const scores = used.map((f) => ({
        value: f.score,
        raw: f.raw,
        itemStyle: { color: f.score >= 75 ? '#2f9e44' : f.score <= 25 ? '#e03131' : '#2563eb' },
      }));
      chart.setOption({
        title: {
          text: `综合得分 ${pf.score == null ? '—' : pf.score} ${pf.score_rating || ''}`,
          left: 'center', textStyle: { fontSize: 14 },
        },
        tooltip: {
          trigger: 'axis',
          formatter: (ps) => {
            const i = ps[0].dataIndex;
            return `${names[i]}：${scores[i].value} 分${scores[i].raw != null ? `（原始值 ${scores[i].raw}）` : ''}`;
          },
        },
        grid: { left: 120, right: 40, top: 44, bottom: 30 },
        xAxis: { type: 'value', max: 100, axisLabel: { formatter: '{value}' } },
        yAxis: { type: 'category', data: names },
        series: [{
          type: 'bar', barWidth: 16,
          data: scores,
          label: { show: true, position: 'right', formatter: (p) => p.value },
        }],
      });
    }

    function gauge(el, value, name, color) {
      const chart = initChart(el);
      if (!chart) return;
      chart.setOption({
        series: [{
          type: 'gauge', min: 0, max: 100, startAngle: 210, endAngle: -30,
          progress: { show: true, width: 14, itemStyle: { color } },
          axisLine: { lineStyle: { width: 14 } },
          axisTick: { show: false }, splitLine: { show: false }, axisLabel: { show: false },
          pointer: { show: false },
          detail: {
            valueAnimation: true, formatter: (v) => (value === null ? '—' : v.toFixed(1) + '%'),
            fontSize: 24, offsetCenter: [0, '50%'], color,
          },
          title: { offsetCenter: [0, '82%'], fontSize: 13, color: '#8a919f' },
          data: [{ value: value ?? 0, name }],
        }],
      });
    }

    function renderGauges(p) {
      gauge(document.getElementById('peGauge'), p.portfolio.pe_pct, '综合 PE 分位(1y)', '#2563eb');
      gauge(document.getElementById('pbGauge'), p.portfolio.pb_pct, '综合 PB 分位(1y)', '#1971c2');
    }

    function renderCharts(p) {
      if (p.tag_weights && p.tag_weights.length) {
        weightPie(
          document.getElementById('weightChart'),
          p.tag_weights.map((t) => ({ name: t.tag, value: t.value })),
          '持仓权重（按标签）',
        );
      }
      const peItems = p.stocks
        .filter((s) => !s.is_etf)
        .filter((s) => s.pe_pct !== null && s.pe_pct !== undefined)
        .map((s) => ({ name: s.name, value: s.pe_pct }))
        .sort((a, b) => b.value - a.value);
      if (peItems.length) quantileBars(document.getElementById('peBars'), peItems, 'PE 分位(1y)');
      const pbItems = p.stocks
        .filter((s) => !s.is_etf)
        .filter((s) => s.pb_pct !== null && s.pb_pct !== undefined)
        .map((s) => ({ name: s.name, value: s.pb_pct }))
        .sort((a, b) => b.value - a.value);
      if (pbItems.length) quantileBars(document.getElementById('pbBars'), pbItems, 'PB 分位(1y)');
    }

    function sortedStocks(stocks, mode) {
      const arr = stocks.slice();
      if (mode === 'weight_asc') arr.sort((a, b) => a.weight - b.weight);
      else if (mode === 'tag') arr.sort((a, b) => (a.tag || '').localeCompare(b.tag || '') || b.weight - a.weight);
      else if (mode === 'code') arr.sort((a, b) => a.code.localeCompare(b.code));
      else arr.sort((a, b) => b.weight - a.weight);
      return arr;
    }

    // 逐股/标签明细表格的合计行（权重/市值/盈亏/今日盈亏求和）
    function sumRow(rows) {
      const w = rows.reduce((s, x) => s + x.weight, 0);
      const v = rows.reduce((s, x) => s + x.value, 0);
      const pnl = rows.reduce((s, x) => s + (x.pnl || 0), 0);
      const day = rows.reduce((s, x) => s + (x.day_pnl || 0), 0);
      return `<tr class="sumrow">
        <td>合计 · ${rows.length} 只</td>
        <td>${fmtNum(w)}%</td>
        <td>${fmtNum(v)}</td>
        <td class="${cls(pnl)}">${signed(pnl)}</td>
        <td class="muted">—</td>
        <td class="${cls(day)}">${signed(day)}</td>
        <td colspan="6"></td>
      </tr>`;
    }

    function renderTable(p) {
      const table = document.getElementById('tablePanel').querySelector('table');
      const body = document.getElementById('stockBody');
      const rows = sortedStocks(p.stocks, pfSortMode);
      body.innerHTML = rows.map((s) => `
        <tr>
          <td><a href="/static/stock.html?code=${s.code}">${s.code}</a> ${s.name} <span class="tag-badge edittag" data-edittag="${s.code}" title="点击修改标签">${s.tag || ''}</span></td>
          <td>${fmtNum(s.weight)}%</td>
          <td>${fmtNum(s.value)}</td>
          <td class="${cls(s.pnl)}">${signed(s.pnl)}</td>
          <td class="${cls(s.pnl_pct)}">${signed(s.pnl_pct)}%</td>
          <td class="${cls(s.day_pnl)}">${signed(s.day_pnl)}</td>
          <td>${fmtNum(s.pe)}</td>
          <td>${fmtNum(s.pb)}</td>
          <td>${fmtNum(s.pe_pct)}%</td>
          <td>${fmtNum(s.pb_pct)}%</td>
          <td>${fmtNum(s.dv)}%</td>
          <td>${fmtNum(s.roe)}%</td>
        </tr>`).join('');
      const oldFoot = table.querySelector('tfoot');
      if (oldFoot) oldFoot.remove();
      if (rows.length) table.appendChild(Object.assign(document.createElement('tfoot'), { innerHTML: sumRow(rows) }));
      document.getElementById('emptyTip').style.display = rows.length ? 'none' : 'block';
    }

    // 组合综合 PE/PB 序列折线：周期 tab + dataZoom 拖动分位联动
    let seriesPeriod = '3y';
    function renderSeries(p) {
      const s = p.series;
      const empty = document.getElementById('seriesEmpty');
      const tabsWrap = document.getElementById('seriesTabs');
      const peEl = document.getElementById('peSeriesLine');
      const pbEl = document.getElementById('pbSeriesLine');
      if (!s || !Object.keys(s).length) {
        empty.style.display = 'block';
        tabsWrap.innerHTML = '';
        peEl.innerHTML = '';
        pbEl.innerHTML = '';
        return;
      }
      empty.style.display = 'none';
      if (!(seriesPeriod in s)) seriesPeriod = Object.keys(s)[0];
      tabsWrap.innerHTML = '';
      tabsWrap.appendChild(periodTabs({
        periods: Object.keys(s),
        active: seriesPeriod,
        onChange: (p2) => { seriesPeriod = p2; drawSeries(s); },
      }));
      drawSeries(s);
    }

    function drawSeries(s) {
      const d = s[seriesPeriod];
      if (!d || !d.dates.length) return;
      const fwd = lastPortfolio ? lastPortfolio.portfolio : {};
      // 组合图：实时(蓝线+pin) + 前瞻(橙线+triangle)，与个股图同款颜色规范；图上不写字，由上方图例说明颜色对应
      const mk = (cur, fwdVal) => [
        { name: '实时', value: cur, color: '#2563eb', line: true },
        ...(fwdVal == null ? [] : [{ name: '前瞻', value: fwdVal, color: '#e8590c', symbol: 'triangle', line: true }]),
      ];
      valuationChart(document.getElementById('peSeriesLine'), { dates: d.dates, values: d.pe }, {
        title: `组合综合 PE（${seriesPeriod}）`, label: '综合PE', color: '#2563eb',
        marks: mk(d.cur_pe, fwd.fwd_pe),
      });
      valuationChart(document.getElementById('pbSeriesLine'), { dates: d.dates, values: d.pb }, {
        title: `组合综合 PB（${seriesPeriod}）`, label: '综合PB', color: '#1971c2',
        marks: mk(d.cur_pb, fwd.fwd_pb),
      });
    }

    document.getElementById('pfSortSel').addEventListener('change', (e) => {
      pfSortMode = e.target.value;
      if (lastPortfolio) renderTable(lastPortfolio);
    });

    loadPage();
  </script>
</body>
</html>
