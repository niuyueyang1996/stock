<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>个股分析 · 自建ETF</title>
  <link rel="stylesheet" href="/static/css/style.css">
  <script src="https://cdn.jsdelivr.net/npm/echarts@5/dist/echarts.min.js"></script>
</head>
<body>
  <nav></nav>
  <div class="container">
    <div class="panel">
      <div class="row">
        <h2 id="title" style="margin:0">个股详情</h2>
        <span class="grow"></span>
        <div id="searchBox"></div>
        <button class="btn" id="buyBtn" onclick="quickTrade('buy')">买入</button>
        <button class="btn danger" id="sellBtn" onclick="quickTrade('sell')">卖出</button>
        <button class="btn" id="refreshDyn" onclick="refreshStock(false)">⚡ 刷新此股</button>
        <button class="btn primary" id="refreshFull" onclick="refreshStock(true)">🔄 全量刷新此股</button>
      </div>
      <div id="staleTip" class="muted" style="display:none;margin-top:6px"></div>
    </div>

    <div class="panel" id="growthPanel" style="display:none">
      <div class="row">
        <h2 style="margin:0">预期年同比增速</h2>
        <span class="muted">净利</span>
        <input type="number" id="growthInput" step="0.01" style="width:120px">
        <span class="muted">营收</span>
        <input type="number" id="revenueGrowthInput" step="0.01" style="width:120px">
        <button class="btn primary" onclick="saveExpectedGrowth()">保存</button>
        <span class="muted" id="growthMeta"></span>
      </div>
    </div>

    <div class="panel" id="tagPanel" style="display:none">
      <div class="row">
        <h2 style="margin:0">标签</h2>
        <input type="text" id="tagInput" maxlength="20" style="width:140px" placeholder="如：红利/科技/银行">
        <button class="btn primary" onclick="saveTag()">保存</button>
        <span class="muted" id="tagMeta"></span>
      </div>
    </div>

    <div class="cards" id="quoteCards"></div>

    <div class="panel">
      <h2>盈利与成长 <span class="sub">静态 / TTM / 前瞻 对比</span></h2>
      <table>
        <thead><tr><th>指标</th><th>静态</th><th>TTM</th><th>前瞻</th></tr></thead>
        <tbody id="growthBody"><tr><td colspan="4" class="muted">暂无数据（请先全量刷新）</td></tr></tbody>
      </table>
    </div>

    <div class="panel">
      <h2>财务指标（最新报告期）</h2>
      <div class="cards" id="finCards"></div>
    </div>

    <div class="panel">
      <h2>历史分位（实时值 / 前瞻值 的百分位）</h2>
      <div class="row" style="align-items:stretch">
        <div class="chart sm" id="peQ" style="flex:1;min-width:280px"></div>
        <div class="chart sm" id="pbQ" style="flex:1;min-width:280px"></div>
      </div>
    </div>

    <div class="panel">
      <h2>估值历史 <span class="sub">百度源 · 标注实时/前瞻值 · 可拖动缩放切换分位窗口</span></h2>
      <div id="histTabs"></div>
      <div class="chart lg" id="peLine" style="height:340px"></div>
      <div class="chart lg" id="pbLine" style="height:340px"></div>
    </div>

    <div class="row" style="align-items:stretch">
      <div class="panel grow">
        <h2>全天五档资金流（最新交易日）</h2>
        <div class="chart sm" id="flowBars"></div>
        <div class="empty" id="flowEmpty" style="display:none;padding:20px">资金流暂无数据（数据源暂缺）。</div>
      </div>
      <div class="panel grow">
        <h2>近30日主力净流入</h2>
        <div class="chart sm" id="flowLine"></div>
        <div class="empty" id="flowLineEmpty" style="display:none;padding:20px">暂无历史资金流数据。</div>
      </div>
    </div>

    <div class="panel">
      <h2>15分钟资金流趋势</h2>
      <div class="empty" style="padding:20px">15分钟资金流暂无可用数据源，功能占位，后续版本接入。</div>
    </div>

  </div>

  <script src="/static/js/api.js"></script>
  <script src="/static/js/common.js"></script>
  <script src="/static/js/charts.js"></script>
  <script>
    initNav('stock');
    let currentCode = new URLSearchParams(location.search).get('code') || '';
    let lastQuote = null;
    let lastName = '';
    let lastLive = {};

    // 搜索框
    const sb = stockSearchInput();
    const input = sb.querySelector('input');
    if (currentCode) input.value = currentCode;
    sb.querySelector('input').addEventListener('change', () => {
      const p = parseStockChoice(sb.querySelector('input').value);
      if (p) { currentCode = p.code; history.replaceState(null, '', '?code=' + p.code); loadPage(); }
    });
    document.getElementById('searchBox').appendChild(sb);

    // 单股刷新：弹窗多选内容 → 调 /stocks/{code}/refresh[/full] → 重载
    async function refreshStock(full) {
      if (!currentCode) return toast('请先选择股票');
      const btn = document.getElementById(full ? 'refreshFull' : 'refreshDyn');
      await doRefresh(btn, full, 'stock', currentCode);
    }

    async function saveExpectedGrowth() {
      const v = parseFloat(document.getElementById('growthInput').value);
      const rv = parseFloat(document.getElementById('revenueGrowthInput').value);
      if (Number.isNaN(v) || Number.isNaN(rv)) return toast('请输入有效的净利/营收预期增速（%）');
      try {
        await Promise.all([
          api('/stocks/' + currentCode + '/expected-growth', { method: 'PUT', body: { growth: v } }),
          api('/stocks/' + currentCode + '/expected-revenue-growth', { method: 'PUT', body: { growth: rv } }),
        ]);
        toast('已保存预期增速');
        await loadPage();
      } catch (e) {
        toast('保存失败：' + e.message, 4000);
      }
    }

    async function saveTag() {
      const tag = document.getElementById('tagInput').value.trim();
      if (!tag) return toast('请输入标签');
      try {
        await api('/stocks/' + currentCode + '/tag', { method: 'PUT', body: { tag } });
        toast('已保存标签');
        await loadPage();
      } catch (e) {
        toast('保存失败：' + e.message, 4000);
      }
    }

    function quickTrade(side) {
      if (!currentCode) return toast('请先选择股票');
      const sideText = side === 'buy' ? '买入' : '卖出';
      const mask = document.createElement('div');
      mask.className = 'modal-mask';
      mask.innerHTML = `
        <div class="modal">
          <h3>${sideText} ${lastName || currentCode}</h3>
          <div class="row">
            <input type="number" id="qtPrice" step="0.001" min="0" value="${lastQuote ? lastQuote.price : ''}" placeholder="成交价" style="width:110px">
            <input type="number" id="qtQty" step="1" min="0" placeholder="数量" style="width:110px">
            <input type="number" id="qtFee" step="0.01" min="0" value="0" placeholder="费用" style="width:100px">
          </div>
          <div class="modal-actions">
            <button class="btn" id="qtCancel">取消</button>
            <button class="btn primary" id="qtOk">确认${sideText}</button>
          </div>
        </div>`;
      document.body.appendChild(mask);
      const close = () => mask.remove();
      mask.querySelector('#qtCancel').onclick = close;
      mask.addEventListener('click', (e) => { if (e.target === mask) close(); });
      mask.querySelector('#qtOk').onclick = async () => {
        const price = parseFloat(mask.querySelector('#qtPrice').value);
        const quantity = parseFloat(mask.querySelector('#qtQty').value);
        const fee = parseFloat(mask.querySelector('#qtFee').value) || 0;
        if (!price || !quantity) return toast('请填写价格与数量');
        try {
          await api('/trades', {
            method: 'POST',
            body: { code: currentCode, name: lastName || null, side, price, quantity, fee },
          });
          toast('已录入' + sideText);
          close();
          await loadPage();
        } catch (e) {
          toast('录入失败：' + e.message, 4000);
        }
      };
    }

    async function loadPage() {
      if (!currentCode) {
        document.getElementById('title').textContent = '请输入股票代码或名称';
        return;
      }
      try {
        const d = await api('/stocks/' + currentCode);
        render(d);
      } catch (e) {
        document.getElementById('title').textContent = `查询失败：${e.message}`;
      }
    }

    function render(d) {
      document.getElementById('title').textContent = `${d.code} ${d.name}`;
      const q = d.quote;
      lastQuote = q;
      lastName = d.name;
      const staleTip = document.getElementById('staleTip');
      staleTip.style.display = q.stale ? 'block' : 'none';
      staleTip.textContent = q.stale ? '⚠ 缓存无当日数据，展示最近交易日缓存（点击「⚡ 刷新此股」拉取最新）' : `数据截至 ${q.ts}${q.stale ? '' : ''}`;

      const live = d.live || {};
      lastLive = live;
      renderGrowth(live);
      const growthPanel = document.getElementById('growthPanel');
      if (live.expected_growth != null) {
        growthPanel.style.display = '';
        document.getElementById('growthInput').value = live.expected_growth;
        document.getElementById('revenueGrowthInput').value = live.expected_revenue_growth;
        const pSrc = live.expected_growth_source === 'user' ? '净利自定义' : '净利默认最新财报';
        const rSrc = live.expected_revenue_growth_source === 'user' ? '营收自定义' : '营收默认TTM同比';
        document.getElementById('growthMeta').textContent = `${pSrc} · ${rSrc}`;
      } else {
        growthPanel.style.display = 'none';
      }
      const tagPanel = document.getElementById('tagPanel');
      tagPanel.style.display = '';
      document.getElementById('tagInput').value = d.tag || '';
      document.getElementById('tagMeta').textContent = d.is_etf
        ? 'ETF：只计入持仓，不参与个股统计'
        : '';
      const mvYi = live.total_mv != null ? fmtNum(live.total_mv / 1e8) + ' 亿' : '—';
      const pe = live.pe != null ? live.pe : d.valuation && d.valuation.pe_ttm;
      const pb = live.pb != null ? live.pb : d.valuation && d.valuation.pb;
      const dayPnlPrice = (q.price != null && q.prev_close != null) ? q.price - q.prev_close : null;
      document.getElementById('quoteCards').innerHTML = [
        ['现价', fmtNum(q.price), (q.pct_chg ?? 0) >= 0 ? 'up' : 'down'],
        ['昨收', q.prev_close != null ? fmtNum(q.prev_close) : '—'],
        ['今开', fmtNum(q.open)],
        ['今日盈亏', dayPnlPrice != null ? signed(dayPnlPrice) + ' 元' : '—', dayPnlPrice != null ? cls(dayPnlPrice) : ''],
        ['涨跌幅', q.pct_chg != null ? signed(q.pct_chg) + '%' : '—', q.pct_chg != null ? cls(q.pct_chg) : ''],
        ['实时市值', mvYi],
      ].map(([l, v, c]) => `<div class="card"><div class="label">${l}</div><div class="value small ${c || ''}">${v}</div></div>`).join('');

      renderQuantiles(d.quantiles);
      renderValuationHistory(d);
      renderFlow(d);
      renderFinancials(d.financials);
    }

    function renderGrowth(live) {
      const body = document.getElementById('growthBody');
      const rows = [
        ['ROE', live.roe_static, live.roe_ttm, live.fwd_roe, 'pct'],
        ['营收增长', live.revenue_yoy_static, live.revenue_yoy_ttm, live.fwd_revenue_yoy, 'pct'],
        ['净利增长', live.profit_yoy_static, live.profit_yoy_ttm, live.fwd_profit_yoy, 'pct'],
        ['PE', live.pe_static, live.pe, live.fwd_pe, 'num'],
        ['PB', live.pb_static, live.pb, live.fwd_pb, 'num'],
        ['股息率', live.dv_static, live.dv_ratio, live.fwd_dv_ratio, 'pct'],
        ['市销率', live.ps_static, live.ps_ttm, live.ps_fwd, 'num'],
      ];
      body.innerHTML = rows.map(([name, a, b, c, kind]) => {
        const fmt = (v) => (v == null ? '—' : kind === 'pct' ? fmtPct(v) : fmtNum(v));
        return `<tr><td>${name}</td><td>${fmt(a)}</td><td>${fmt(b)}</td><td>${fmt(c)}</td></tr>`;
      }).join('');
    }

    // 估值历史折线图：周期切换 + 标注实时/前瞻值（拖动缩放分位联动在 charts.js 内）
    let histPeriod = '3y';
    function renderValuationHistory(d) {
      const hist = d.valuation_history;
      const tabsWrap = document.getElementById('histTabs');
      const peEl = document.getElementById('peLine');
      const pbEl = document.getElementById('pbLine');
      if (!hist || !hist.periods || !Object.keys(hist.periods).length) {
        peEl.innerHTML = '<div class="empty" style="padding:20px">暂无历史估值序列（请先「全量刷新」）。</div>';
        pbEl.innerHTML = '';
        tabsWrap.innerHTML = '';
        return;
      }
      if (!(histPeriod in hist.periods)) histPeriod = hist.default || '3y';
      tabsWrap.innerHTML = '';
      tabsWrap.appendChild(periodTabs({
        periods: Object.keys(hist.periods),
        active: histPeriod,
        onChange: (p) => { histPeriod = p; renderValuationHistory(d); },
      }));
      const series = hist.periods[histPeriod];
      if (!series || !series.pe.length) {
        peEl.innerHTML = '<div class="empty" style="padding:20px">该周期暂无序列。</div>';
        pbEl.innerHTML = '';
        return;
      }
      const live = d.live || {};
      // 个股图：实时(蓝pin+蓝虚线) + 前瞻(橙triangle+橙虚线)，与组合图同款样式，数值显示在图上方 subtext
      const mk = (v) => (v == null ? [] : [{ name: '前瞻', value: v, color: '#e8590c', symbol: 'triangle', line: true }]);
      valuationChart(peEl, series.pe, {
        title: 'PE 历史（' + histPeriod + '）', label: 'PE', color: '#2563eb',
        marks: [
          { name: '实时', value: live.pe, color: '#2563eb', line: true },
          ...mk(live.fwd_pe),
        ],
      });
      valuationChart(pbEl, series.pb, {
        title: 'PB 历史（' + histPeriod + '）', label: 'PB', color: '#2563eb',
        marks: [
          { name: '实时', value: live.pb, color: '#2563eb', line: true },
          ...mk(live.fwd_pb),
        ],
      });
    }

    function renderQuantiles(ql) {
      const mk = (el, key) => {
        const chart = initChart(el);
        if (!chart) return;
        const periods = ['1y', '3y', '5y'];
        chart.setOption({
          title: { text: `${key === 'pe_pct' ? 'PE' : 'PB'} 分位`, left: 'center', textStyle: { fontSize: 14 } },
          tooltip: { formatter: (p) => `${p.name}：${p.value}%` },
          grid: { left: 40, right: 40, top: 40, bottom: 30 },
          xAxis: { type: 'category', data: periods.map((x) => x + '分位') },
          yAxis: { type: 'value', max: 100, axisLabel: { formatter: '{value}%' } },
          series: [{
            type: 'bar', barWidth: 34,
            data: periods.map((p) => {
              const row = ql[p];
              const v = row ? row[key] : null;
              return { value: v, itemStyle: { color: v === null ? '#ccc' : v <= 25 ? '#2f9e44' : v >= 75 ? '#e03131' : '#2563eb' } };
            }),
            label: { show: true, position: 'top', formatter: (p) => (p.value === null ? '—' : p.value + '%') },
          }],
        });
      };
      mk(document.getElementById('peQ'), 'pe_pct');
      mk(document.getElementById('pbQ'), 'pb_pct');
    }

    function renderFlow(d) {
      const latest = d.fundflow_latest;
      if (latest) {
        document.getElementById('flowEmpty').style.display = 'none';
        fundflowBars(document.getElementById('flowBars'), latest);
      } else {
        document.getElementById('flowEmpty').style.display = 'block';
        document.getElementById('flowBars').innerHTML = '';
      }
      const hist = d.fundflow_history || [];
      if (hist.length) {
        document.getElementById('flowLineEmpty').style.display = 'none';
        fundflowLine(document.getElementById('flowLine'), hist);
      } else {
        document.getElementById('flowLineEmpty').style.display = 'block';
        document.getElementById('flowLine').innerHTML = '';
      }
    }

    function renderFinancials(fin) {
      if (!fin) {
        document.getElementById('finCards').innerHTML =
          '<div class="empty" style="padding:20px">暂无财务数据（请先「全量刷新」）。</div>';
        return;
      }
      const cards = [
        ['报告期', fin.report_date],
        ['去年归母净利', fmtNum(fin.net_profit / 1e8) + ' 亿'],
        ['最新归母净资产', fin.net_assets != null ? fmtNum(fin.net_assets / 1e8) + ' 亿' : '—'],
        ['总股本', fin.total_shares != null ? fmtNum(fin.total_shares / 1e8) + ' 亿股' : '—'],
        ['每股收益(去年)', fin.eps != null ? fmtNum(fin.eps) + ' 元' : '—'],
        ['每股股息(去年)', fin.dv_per_share != null ? fmtNum(fin.dv_per_share) + ' 元' : '—'],
        ['支付率(去年)', fin.payout_ratio != null ? fmtPct(fin.payout_ratio) : '—'],
      ];
      document.getElementById('finCards').innerHTML = cards.map(([l, v]) =>
        `<div class="card"><div class="label">${l}</div><div class="value small">${v}</div></div>`).join('');
    }

    loadPage();
  </script>
</body>
</html>
